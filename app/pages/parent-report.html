<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI學測考總複習｜家長週報</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="../assets/css/style.css?v=20260810-system01" />
  </head>
  <body class="parent-page">
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">AI學測考總複習</p>
          <h1>家長週報</h1>
        </div>
        <div class="topbar-actions">
          <button class="secondary-action compact-action" id="clearProgressButton" type="button">清除作答資料</button>
          <a class="text-link" id="returnHomeButton" href="../index.html">回闖關地圖</a>
        </div>
      </header>

      <section class="summary-grid parent-report-summary" aria-label="家長週報摘要">
        <article class="summary-panel main-summary">
          <div class="panel-heading">
            <p class="label">週期</p>
            <strong id="reportRange">--</strong>
          </div>
          <div class="hero-task">
            <h2 id="reportTitle">讀取週報</h2>
            <p id="reportMode">請稍候</p>
          </div>
        </article>
        <article class="summary-panel metric-panel">
          <p class="label">完成天數</p>
          <strong id="completedDays">--</strong>
          <span>天</span>
        </article>
        <article class="summary-panel metric-panel">
          <p class="label">答對率</p>
          <strong id="correctRate">--</strong>
          <span>%</span>
        </article>
        <article class="summary-panel metric-panel">
          <p class="label">總題數</p>
          <strong id="totalQuestions">--</strong>
          <span>題</span>
        </article>
      </section>

      <section class="panel wide-panel parent-message-panel">
        <div class="section-title">
          <h2>給家長看的白話摘要</h2>
          <span id="reportStatus">--</span>
        </div>
        <p id="parentMessage">讀取中</p>
      </section>

      <section class="panel wide-panel parent-message-panel">
        <div class="section-title">
          <h2>五科一週複習狀態</h2>
          <span id="familySystemStatus">讀取中</span>
        </div>
        <div class="report-info-grid" id="familySystemGrid"></div>
      </section>

      <section class="parent-report-columns">
        <div class="parent-report-column">
          <article class="panel">
            <div class="section-title">
              <h2>本週表現</h2>
              <span>摘要</span>
            </div>
            <div class="report-info-grid" id="performanceGrid"></div>
          </article>

          <article class="panel">
            <div class="section-title">
              <h2>錯題複習狀態</h2>
              <span id="reviewPlanCount">--</span>
            </div>
            <div class="parent-review-stack" id="parentReviewStack"></div>
          </article>
        </div>

        <div class="parent-report-column">
          <article class="panel">
            <div class="section-title">
              <h2>主要弱點</h2>
              <span id="weaknessCount">--</span>
            </div>
            <div class="parent-weakness-stack" id="parentWeaknessStack"></div>
          </article>

          <article class="panel">
            <div class="section-title">
              <h2>下週安排</h2>
              <span>20-30 分鐘</span>
            </div>
            <div class="next-plan-box" id="nextPlanBox"></div>
          </article>
        </div>
      </section>
    </main>

    <script src="../assets/js/session.js?v=20260810-system01"></script>
    <script src="../assets/js/parent-report.js?v=20260810-parent-return01"></script>
  </body>
</html>
