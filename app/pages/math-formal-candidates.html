<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI學測考總複習｜數學候選題庫 v0.1</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="../assets/css/style.css?v=20260810-mathpreview03" />
    <style>
      .candidate-page {
        background:
          linear-gradient(180deg, #eef7fa 0, #f5f7fb 340px),
          var(--bg);
        color: var(--ink);
      }

      .candidate-shell {
        max-width: 1120px;
      }

      .candidate-page .topbar {
        align-items: center;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 18px;
        background: linear-gradient(135deg, #f8fcff 0%, #e9f4f1 100%);
        box-shadow: var(--shadow);
      }

      .candidate-page .topbar > div {
        min-width: 0;
      }

      .candidate-page .topbar h1 {
        color: #102536;
        overflow-wrap: anywhere;
      }

      .candidate-alert,
      .candidate-day,
      .candidate-question,
      .candidate-stat {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        box-shadow: var(--shadow);
      }

      .candidate-alert {
        display: grid;
        gap: 8px;
        margin-bottom: 16px;
        padding: 18px;
        border-left: 5px solid var(--warn);
      }

      .candidate-alert p {
        margin: 0;
        color: var(--muted);
      }

      .candidate-stats {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 10px;
        margin-bottom: 16px;
      }

      .candidate-stat {
        padding: 14px;
      }

      .candidate-stat span {
        display: block;
        color: var(--muted);
        font-size: 0.86rem;
      }

      .candidate-stat strong {
        display: block;
        margin-top: 4px;
        color: var(--primary);
        font-size: 1.4rem;
      }

      .candidate-toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin: 0 0 16px;
      }

      .candidate-filter {
        min-height: 42px;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 0 12px;
        background: var(--surface);
        color: var(--ink);
        font: inherit;
        font-weight: 800;
      }

      .candidate-list {
        display: grid;
        gap: 16px;
        min-width: 0;
      }

      .candidate-day {
        padding: 18px;
        min-width: 0;
        max-width: 100%;
      }

      .candidate-day-header,
      .candidate-question-header {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: flex-start;
        justify-content: space-between;
        margin-bottom: 12px;
      }

      .candidate-day h2 {
        margin: 0;
      }

      .candidate-material {
        border: 1px solid var(--line);
        border-radius: 8px;
        margin: 10px 0;
        padding: 12px;
        background: var(--surface-muted);
        overflow-x: auto;
        min-width: 0;
        max-width: 100%;
      }

      .candidate-material p,
      .math-code {
        margin-bottom: 0;
        white-space: pre-wrap;
      }

      .math-code {
        border: 1px solid rgba(21, 94, 117, 0.18);
        border-radius: 8px;
        padding: 10px;
        background: #fbfdfe;
        color: #123246;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
        overflow-x: auto;
      }

      .math-readable {
        border: 1px solid rgba(21, 94, 117, 0.18);
        border-radius: 8px;
        padding: 10px 12px;
        background: #fbfdfe;
        color: #123246;
        font-weight: 850;
        overflow-wrap: anywhere;
      }

      .math-graph {
        display: block;
        width: 100%;
        max-width: 520px;
        height: auto;
        margin-top: 10px;
        border: 1px solid rgba(21, 94, 117, 0.18);
        border-radius: 8px;
        background: #ffffff;
      }

      .math-spec-list {
        display: grid;
        gap: 6px;
        margin: 10px 0 0;
        padding: 0;
        list-style: none;
      }

      .math-spec-list li {
        border: 1px solid rgba(21, 94, 117, 0.14);
        border-radius: 8px;
        padding: 8px 10px;
        background: #fbfdfe;
      }

      .candidate-table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 8px;
        min-width: 420px;
        font-size: 0.94rem;
      }

      .candidate-table th,
      .candidate-table td {
        border: 1px solid var(--line);
        padding: 8px;
        text-align: left;
        vertical-align: top;
      }

      .candidate-table th {
        background: var(--surface);
      }

      .candidate-question {
        margin-top: 12px;
        padding: 14px;
        min-width: 0;
        max-width: 100%;
        overflow-wrap: anywhere;
        word-break: normal;
      }

      .candidate-question-header > *,
      .candidate-day-header > *,
      .social-tags {
        min-width: 0;
      }

      .social-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .candidate-options {
        display: grid;
        gap: 8px;
        margin: 12px 0;
        padding: 0;
        list-style: none;
      }

      .candidate-options li,
      .candidate-answer,
      .candidate-review {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px 12px;
        background: var(--surface-muted);
      }

      .candidate-options strong {
        margin-right: 8px;
        color: var(--primary);
      }

      .candidate-answer,
      .candidate-review {
        margin-top: 10px;
      }

      .candidate-review {
        color: var(--muted);
      }

      .candidate-status {
        display: inline-flex;
        align-items: center;
        min-height: 30px;
        border: 1px solid rgba(139, 94, 24, 0.26);
        border-radius: 999px;
        padding: 4px 10px;
        background: #fff7e8;
        color: var(--warn);
        font-size: 0.86rem;
        font-weight: 900;
        white-space: nowrap;
      }

      .candidate-empty {
        padding: 18px;
        border: 1px dashed var(--line);
        border-radius: 8px;
        color: var(--muted);
      }

      .candidate-empty strong {
        display: block;
        margin-bottom: 6px;
        color: var(--ink);
      }

      @media (max-width: 760px) {
        .candidate-stats {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .candidate-page .topbar {
          align-items: stretch;
          flex-direction: column;
        }

        .candidate-page .topbar h1 {
          font-size: 1.45rem;
        }

        .candidate-day,
        .candidate-question {
          padding: 14px;
        }
      }
    </style>
  </head>
  <body class="candidate-page">
    <main class="app-shell candidate-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">AI學測考總複習</p>
          <h1>數學候選題庫 v0.1 batch_01</h1>
        </div>
        <a class="secondary-action link-action" href="../index.html">返回主頁</a>
      </header>

      <section class="candidate-alert" aria-label="題庫狀態">
        <strong>數學第一批仍待人工審題</strong>
        <p>本批是數學科 AI 新題試跑候選題，狀態全部為 needs_human_review。它尚未接入正式闖關，也不是已完成題庫。</p>
      </section>

      <section class="candidate-stats" id="summaryStats" aria-label="統計"></section>

      <section class="candidate-toolbar" aria-label="篩選">
        <select class="candidate-filter" id="weekdayFilter" aria-label="星期篩選">
          <option value="all">全部星期</option>
          <option value="Tue">週二</option>
          <option value="Thu">週四</option>
          <option value="Sat">週六</option>
          <option value="Sun">週日</option>
        </select>
        <select class="candidate-filter" id="trackFilter" aria-label="數學 A B 篩選">
          <option value="all">全部 A/B</option>
        </select>
        <select class="candidate-filter" id="typeFilter" aria-label="題型篩選">
          <option value="all">全部題型</option>
        </select>
      </section>

      <section class="candidate-list" id="candidateList" aria-live="polite"></section>
    </main>

    <script>
      const LOCAL_DATA_URL = "../../data/math_formal_candidates_v0_1_batch_01.json?v=20260810-mathpreview03";
      const REMOTE_DATA_URL = "https://jackchan1973.github.io/ai-gsat-chinese-prototype/data/math_formal_candidates_v0_1_batch_01.json?v=20260810-mathpreview03";
      const weekdayLabels = {
        Tue: "週二",
        Thu: "週四",
        Sat: "週六",
        Sun: "週日"
      };
      const statusLabels = {
        needs_human_review: "待人工審題",
        needs_revision: "需修訂",
        approved_for_app: "正式題",
        excluded: "排除"
      };
      const taskTypeLabels = {
        algebra_function_model: "代數、函數與模型",
        probability_statistics_data: "機率統計與資料判讀",
        geometry_vector_graph: "圖形、幾何與向量",
        mixed_reasoning_written: "混合推理與非選表達"
      };
      let days = [];
      let questions = [];

      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;");
      }

      function answerText(answer) {
        if (Array.isArray(answer)) return answer.join("、");
        if (answer && typeof answer === "object") {
          return Object.entries(answer).map(([key, value]) => `${key}: ${value}`).join("；");
        }
        return String(answer ?? "");
      }

      function getDataUrls() {
        return window.location.protocol === "file:" ? [REMOTE_DATA_URL, LOCAL_DATA_URL] : [LOCAL_DATA_URL, REMOTE_DATA_URL];
      }

      async function loadCandidateData() {
        const errors = [];
        for (const url of getDataUrls()) {
          try {
            const response = await fetch(url);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            return await response.json();
          } catch (error) {
            errors.push(`${url}: ${error.message}`);
          }
        }
        throw new Error(errors.join("；"));
      }

      function renderStats() {
        const written = questions.filter((item) => item.question.requires_written_response).length;
        const approved = questions.filter((item) => item.question.status === "approved_for_app").length;
        const stats = [
          ["總題數", questions.length],
          ["任務日", days.length],
          ["文字作答", written],
          ["正式題", approved],
          ["狀態", "待審"]
        ];
        document.getElementById("summaryStats").innerHTML = stats
          .map(([label, value]) => `<div class="candidate-stat"><span>${escapeHtml(label)}</span><strong>${escapeHtml(value)}</strong></div>`)
          .join("");
      }

      function renderFilters() {
        const types = Array.from(new Set(questions.map((item) => item.question.question_type))).sort();
        const tracks = Array.from(new Set(questions.map((item) => item.question.math_track))).sort();
        document.getElementById("typeFilter").innerHTML = '<option value="all">全部題型</option>' + types
          .map((type) => `<option value="${escapeHtml(type)}">${escapeHtml(type)}</option>`)
          .join("");
        document.getElementById("trackFilter").innerHTML = '<option value="all">全部 A/B</option>' + tracks
          .map((track) => `<option value="${escapeHtml(track)}">數學 ${escapeHtml(track)}</option>`)
          .join("");
      }

      function renderTable(material) {
        const columns = material.columns || [];
        const rows = material.rows || [];
        return `
          <table class="candidate-table">
            <thead>
              <tr>
                <th>${escapeHtml(material.row_header || "")}</th>
                ${columns.map((column) => `<th>${escapeHtml(column)}</th>`).join("")}
              </tr>
            </thead>
            <tbody>
              ${rows.map((row) => `
                <tr>
                  <th>${escapeHtml(row.label || "")}</th>
                  ${(row.values || []).map((cell) => `<td>${escapeHtml(cell)}</td>`).join("")}
                </tr>
              `).join("")}
            </tbody>
          </table>
        `;
      }

      function formatMathText(value) {
        const raw = String(value || "");
        if (raw.includes("projection length")) return "正射影長 = (v · u) / |u|";
        if (raw.includes("x_{n+1}=0.7x_n+12")) return "xₙ₊₁ = 0.7xₙ + 12，x₀ = 100";
        if (raw.includes("begin{bmatrix}2&-1")) return "A = [[2, -1], [1, 3]]";
        if (raw.includes("120") && raw.includes("frac{6}{10}") && raw.includes("-20")) {
          return "E = 120 × 6/10 × 5/9 + 30 × (2 × 6/10 × 4/9) - 20";
        }
        return raw
          .replaceAll("\\\\", "\\")
          .replace(/\\text\{([^}]*)\}/g, "$1")
          .replace(/\\left/g, "")
          .replace(/\\right/g, "")
          .replace(/\\frac\{([^}]*)\}\{([^}]*)\}/g, "($1) / ($2)")
          .replace(/\\sqrt\{([^}]*)\}/g, "sqrt($1)")
          .replace(/\\begin\{bmatrix\}/g, "[")
          .replace(/\\end\{bmatrix\}/g, "]")
          .replace(/\\cdot/g, "·")
          .replace(/\\quad/g, "，")
          .replace(/\\le/g, "<=")
          .replace(/\\ge/g, ">=")
          .replace(/\\times/g, "×")
          .replace(/\^\{([^}]*)\}/g, "^$1")
          .replace(/_\{([^}]*)\}/g, "_$1")
          .replace(/\s+/g, " ")
          .trim();
      }

      function renderQuadraticGraph(spec) {
        const width = 520;
        const height = 260;
        const pad = 34;
        const xMin = -2;
        const xMax = 6;
        const yMin = -5;
        const yMax = 5;
        const xScale = (width - pad * 2) / (xMax - xMin);
        const yScale = (height - pad * 2) / (yMax - yMin);
        const mapX = (x) => pad + (x - xMin) * xScale;
        const mapY = (y) => height - pad - (y - yMin) * yScale;
        const points = [];
        for (let i = 0; i <= 80; i += 1) {
          const x = xMin + (xMax - xMin) * i / 80;
          const y = (x - 2) ** 2 - 3;
          points.push(`${mapX(x).toFixed(1)},${mapY(y).toFixed(1)}`);
        }
        const vertex = spec.vertex || [2, -3];
        const vertexX = mapX(vertex[0]);
        const vertexY = mapY(vertex[1]);
        return `
          <svg class="math-graph" viewBox="0 0 ${width} ${height}" role="img" aria-label="拋物線 ${escapeHtml(spec.equation || "")}">
            <line x1="${pad}" y1="${mapY(0)}" x2="${width - pad}" y2="${mapY(0)}" stroke="#8aa2b2" stroke-width="1" />
            <line x1="${mapX(0)}" y1="${pad}" x2="${mapX(0)}" y2="${height - pad}" stroke="#8aa2b2" stroke-width="1" />
            <line x1="${mapX(2)}" y1="${pad}" x2="${mapX(2)}" y2="${height - pad}" stroke="#c2410c" stroke-width="1.5" stroke-dasharray="5 5" />
            <polyline points="${points.join(" ")}" fill="none" stroke="#155e75" stroke-width="3" stroke-linejoin="round" />
            <circle cx="${vertexX}" cy="${vertexY}" r="5" fill="#c2410c" />
            <text x="${vertexX + 8}" y="${vertexY - 8}" fill="#17212b" font-size="14">頂點 (2,-3)</text>
            <text x="${mapX(2) + 8}" y="${pad + 16}" fill="#c2410c" font-size="13">對稱軸 x=2</text>
            <text x="${pad}" y="${height - 8}" fill="#61707e" font-size="13">${escapeHtml(spec.equation || "")}</text>
          </svg>
        `;
      }

      function renderSpecSummary(material) {
        const spec = material.spec || {};
        if (material.type === "graph_spec" && spec.type === "quadratic") {
          return `
            <p>拋物線：${escapeHtml(spec.equation || "")}</p>
            <p>頂點：(${escapeHtml((spec.vertex || []).join(","))})；開口：${spec.opens === "up" ? "向上" : escapeHtml(spec.opens || "未標")}</p>
            ${renderQuadraticGraph(spec)}
          `;
        }
        const items = [];
        if (spec.transform) items.push(`變換：${spec.transform}`);
        if (spec.points) {
          Object.entries(spec.points).forEach(([name, point]) => {
            items.push(`${name} 點：(${point.join(",")})`);
          });
        }
        if (spec.vectors_from_A) items.push(`從 A 出發的向量：${spec.vectors_from_A.join("、")}`);
        if (spec.segments) items.push(`線段：${spec.segments.map((segment) => segment.join("")).join("、")}`);
        return `<ul class="math-spec-list">${items.map((item) => `<li>${escapeHtml(item)}</li>`).join("")}</ul>`;
      }

      function renderMaterial(material) {
        if (material.type === "table") {
          return `
            <section class="candidate-material">
              <strong>${escapeHtml(material.title || "資料表")}</strong>
              ${renderTable(material)}
            </section>
          `;
        }
        if (material.type === "latex") {
          return `
            <section class="candidate-material">
              <strong>${escapeHtml(material.title || "公式")}</strong>
              <div class="math-readable">${escapeHtml(formatMathText(material.content || ""))}</div>
            </section>
          `;
        }
        if (material.type === "diagram_spec" || material.type === "graph_spec") {
          return `
            <section class="candidate-material">
              <strong>${escapeHtml(material.title || "圖形說明")}</strong>
              ${renderSpecSummary(material)}
            </section>
          `;
        }
        return `
          <section class="candidate-material">
            <strong>${escapeHtml(material.title || "材料")}</strong>
            <p>${escapeHtml(material.content || "")}</p>
          </section>
        `;
      }

      function renderQuestion(item, index) {
        const question = item.question;
        const statusText = statusLabels[question.status] || question.status || "未標";
        const options = question.options && question.options.length
          ? `<ul class="candidate-options">${question.options.map((option) => `<li><strong>${escapeHtml(option.key)}</strong>${escapeHtml(option.text)}</li>`).join("")}</ul>`
          : '<p class="candidate-empty">選填或短答題，無選項。</p>';
        return `
          <article class="candidate-question" data-weekday="${item.weekday}" data-type="${escapeHtml(question.question_type)}" data-track="${escapeHtml(question.math_track)}">
            <div class="candidate-question-header">
              <div class="social-tags">
                <span class="tag">${escapeHtml(question.id)}</span>
                <span class="tag">${escapeHtml(question.question_type)}</span>
                <span class="tag">數學 ${escapeHtml(question.math_track)}</span>
                <span class="tag">${escapeHtml(question.difficulty)}</span>
                <span class="tag">${question.requires_written_response ? "週日短答" : "非正式題"}</span>
              </div>
              <span class="candidate-status">${escapeHtml(statusText)}</span>
            </div>
            <p class="label">${escapeHtml(weekdayLabels[item.weekday] || item.weekday)} 第 ${index + 1} 題</p>
            <div>${escapeHtml(question.stem)}</div>
            ${(question.materials || []).map(renderMaterial).join("")}
            ${options}
            <details class="candidate-answer">
              <summary>查看答案與解析</summary>
              <p><strong>答案：</strong>${escapeHtml(answerText(question.answer))}</p>
              ${question.scoring_rule ? `<p><strong>評分規準：</strong>${escapeHtml(question.scoring_rule)}</p>` : ""}
              <p><strong>解析：</strong>${escapeHtml(question.explanation)}</p>
              <p><strong>複習建議：</strong>${escapeHtml(question.review_advice)}</p>
            </details>
            <div class="candidate-review">
              <p><strong>知識標籤：</strong>${escapeHtml((question.knowledge_tags || []).join("、"))}</p>
              <p><strong>能力標籤：</strong>${escapeHtml((question.ability_tags || []).join("、"))}</p>
              <p><strong>審題紀錄：</strong>${escapeHtml((question.review_notes || []).join(" "))}</p>
              <p><strong>相似風險：</strong>${escapeHtml(question.similarity_risk || "未標")}</p>
            </div>
          </article>
        `;
      }

      function renderDay(day) {
        const dayQuestions = day.question_slots || [];
        const statusText = statusLabels[day.status] || day.status || "未標";
        return `
          <section class="candidate-day" data-weekday="${day.weekday}">
            <div class="candidate-day-header">
              <div>
                <p class="eyebrow">${escapeHtml(day.day_id)}</p>
                <h2>${escapeHtml(day.label)}：${escapeHtml(taskTypeLabels[day.task_type] || day.task_type)}</h2>
              </div>
              <span class="candidate-status">${escapeHtml(statusText)}</span>
            </div>
            ${(day.day_materials || []).map(renderMaterial).join("")}
            <div class="candidate-list">
              ${dayQuestions.map((question, index) => renderQuestion({ weekday: day.weekday, question }, index)).join("")}
            </div>
          </section>
        `;
      }

      function renderList() {
        const weekday = document.getElementById("weekdayFilter").value;
        const type = document.getElementById("typeFilter").value;
        const track = document.getElementById("trackFilter").value;
        const filteredDays = days
          .filter((day) => weekday === "all" || day.weekday === weekday)
          .map((day) => ({
            ...day,
            question_slots: day.question_slots.filter((question) => {
              const typeMatch = type === "all" || question.question_type === type;
              const trackMatch = track === "all" || question.math_track === track;
              return typeMatch && trackMatch;
            })
          }))
          .filter((day) => day.question_slots.length);
        document.getElementById("candidateList").innerHTML = filteredDays.length
          ? filteredDays.map(renderDay).join("")
          : '<div class="candidate-empty">沒有符合條件的題目。</div>';
      }

      async function init() {
        const data = await loadCandidateData();
        days = (data.weeks || []).flatMap((week) => week.days || []);
        questions = days.flatMap((day) => (day.question_slots || []).map((question) => ({ weekday: day.weekday, question })));
        renderStats();
        renderFilters();
        renderList();
        document.getElementById("weekdayFilter").addEventListener("change", renderList);
        document.getElementById("trackFilter").addEventListener("change", renderList);
        document.getElementById("typeFilter").addEventListener("change", renderList);
      }

      init().catch((error) => {
        document.querySelector(".candidate-shell").innerHTML = `
          <section class="error-box">
            <h1>數學題庫讀取失敗</h1>
            <p>${escapeHtml(error.message)}</p>
          </section>
        `;
      });
    </script>
  </body>
</html>
