<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI學測考總複習｜數學題庫 v0.1</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="../assets/css/style.css?v=20260813-consolidated01" />
    <link rel="stylesheet" href="../assets/css/ui-refresh.css?v=20260814" />
    <style>
      .bank-page {
        background:
          linear-gradient(180deg, #eef7fa 0, #f5f7fb 340px),
          var(--bg);
        color: var(--ink);
      }

      .bank-shell {
        max-width: 1120px;
      }

      .bank-page .topbar {
        align-items: center;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 18px;
        background: linear-gradient(135deg, #f8fcff 0%, #e9f4f1 100%);
        box-shadow: var(--shadow);
      }

      .bank-page .topbar > div {
        min-width: 0;
      }

      .bank-page .topbar h1 {
        color: #102536;
        overflow-wrap: anywhere;
      }

      .bank-alert,
      .bank-day,
      .bank-question,
      .bank-stat {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        box-shadow: var(--shadow);
      }

      .bank-alert {
        display: grid;
        gap: 8px;
        margin-bottom: 16px;
        padding: 18px;
        border-left: 5px solid var(--warn);
      }

      .bank-alert p {
        margin: 0;
        color: var(--muted);
      }

      .bank-stats {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 10px;
        margin-bottom: 16px;
      }

      .bank-stat {
        padding: 14px;
      }

      .bank-stat span {
        display: block;
        color: var(--muted);
        font-size: 0.86rem;
      }

      .bank-stat strong {
        display: block;
        margin-top: 4px;
        color: var(--primary);
        font-size: 1.4rem;
      }

      .bank-toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin: 0 0 16px;
      }

      .bank-filter {
        min-height: 42px;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 0 12px;
        background: var(--surface);
        color: var(--ink);
        font: inherit;
        font-weight: 800;
      }

      .bank-list {
        display: grid;
        gap: 16px;
        min-width: 0;
      }

      .bank-day {
        padding: 18px;
        min-width: 0;
        max-width: 100%;
      }

      .bank-day-header,
      .bank-question-header {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: flex-start;
        justify-content: space-between;
        margin-bottom: 12px;
      }

      .bank-day h2 {
        margin: 0;
      }

      .bank-material {
        border: 1px solid var(--line);
        border-radius: 8px;
        margin: 10px 0;
        padding: 12px;
        background: var(--surface-muted);
        overflow-x: auto;
        min-width: 0;
        max-width: 100%;
      }

      .bank-material p,
      .math-code {
        margin-bottom: 0;
        white-space: pre-wrap;
      }

      .math-code {
        border: 1px solid rgba(21, 94, 117, 0.18);
        border-radius: 8px;
        padding: 10px;
        background: #fbfdfe;
        color: #123246;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
        overflow-x: auto;
      }

      .math-readable {
        border: 1px solid rgba(21, 94, 117, 0.18);
        border-radius: 8px;
        padding: 10px 12px;
        background: #fbfdfe;
        color: #123246;
        font-weight: 850;
        overflow-wrap: anywhere;
      }

      .math-graph {
        display: block;
        width: 100%;
        max-width: 760px;
        height: auto;
        margin-top: 10px;
        border: 1px solid rgba(21, 94, 117, 0.18);
        border-radius: 8px;
        background: #ffffff;
      }

      .math-spec-list {
        display: grid;
        gap: 6px;
        margin: 10px 0 0;
        padding: 0;
        list-style: none;
      }

      .math-spec-list li {
        border: 1px solid rgba(21, 94, 117, 0.14);
        border-radius: 8px;
        padding: 8px 10px;
        background: #fbfdfe;
      }

      .bank-table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 8px;
        min-width: 420px;
        font-size: 0.94rem;
      }

      .bank-table th,
      .bank-table td {
        border: 1px solid var(--line);
        padding: 8px;
        text-align: left;
        vertical-align: top;
      }

      .bank-table th {
        background: var(--surface);
      }

      .bank-question {
        margin-top: 12px;
        padding: 14px;
        min-width: 0;
        max-width: 100%;
        overflow-wrap: anywhere;
        word-break: normal;
      }

      .bank-question-header > *,
      .bank-day-header > *,
      .social-tags {
        min-width: 0;
      }

      .social-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .bank-options {
        display: grid;
        gap: 8px;
        margin: 12px 0;
        padding: 0;
        list-style: none;
      }

      .bank-options li,
      .bank-answer,
      .bank-review {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px 12px;
        background: var(--surface-muted);
      }

      .bank-options strong {
        margin-right: 8px;
        color: var(--primary);
      }

      .bank-answer,
      .bank-review {
        margin-top: 10px;
      }

      .bank-review {
        color: var(--muted);
      }

      .bank-status {
        display: inline-flex;
        align-items: center;
        min-height: 30px;
        border: 1px solid rgba(139, 94, 24, 0.26);
        border-radius: 999px;
        padding: 4px 10px;
        background: #fff7e8;
        color: var(--warn);
        font-size: 0.86rem;
        font-weight: 900;
        white-space: nowrap;
      }

      .bank-empty {
        padding: 18px;
        border: 1px dashed var(--line);
        border-radius: 8px;
        color: var(--muted);
      }

      .bank-empty strong {
        display: block;
        margin-bottom: 6px;
        color: var(--ink);
      }

      @media (max-width: 760px) {
        .bank-stats {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .bank-page .topbar {
          align-items: stretch;
          flex-direction: column;
        }

        .bank-page .topbar h1 {
          font-size: 1.45rem;
        }

        .bank-day,
        .bank-question {
          padding: 14px;
        }
      }
    </style>
  </head>
  <body class="bank-page">
    <main class="app-shell bank-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">AI學測考總複習</p>
          <h1 id="pageTitle">數學正式題庫</h1>
        </div>
        <a class="secondary-action link-action" href="../index.html">返回主頁</a>
      </header>

      <section class="bank-alert" aria-label="題庫狀態">
        <strong id="statusTitle">數學正式題庫已整理完成</strong>
        <p id="statusCopy">本檔為數學科單一正式題庫，已接入正式闖關。</p>
      </section>

      <section class="bank-stats" id="summaryStats" aria-label="統計"></section>

      <section class="bank-toolbar" aria-label="篩選">
        <select class="bank-filter" id="weekdayFilter" aria-label="星期篩選">
          <option value="all">全部星期</option>
          <option value="Tue">週二</option>
          <option value="Thu">週四</option>
          <option value="Sun">週日</option>
        </select>
        <select class="bank-filter" id="trackFilter" aria-label="數學 A B 篩選">
          <option value="all">全部 A/B</option>
        </select>
        <select class="bank-filter" id="typeFilter" aria-label="題型篩選">
          <option value="all">全部題型</option>
        </select>
      </section>

      <section class="bank-list" id="bankList" aria-live="polite"></section>
    </main>

    <script>
      const DATA_VERSION = "20260813-consolidated01";
      const LOCAL_DATA_URL = `../../data/banks/math.json?v=${DATA_VERSION}`;
      const REMOTE_DATA_URL = `http://139.224.229.242/data/banks/math.json?v=${DATA_VERSION}`;
      const weekdayLabels = {
        Tue: "週二",
        Thu: "週四",
        Sun: "週日"
      };
      const statusLabels = {
        approved_for_app: "正式題",
        not_online: "未上線"
      };
      const taskTypeLabels = {
        algebra_function_model: "代數、函數與模型",
        probability_statistics_data: "機率統計與資料判讀",
        geometry_vector_graph: "圖形、幾何與向量",
        mixed_reasoning_written: "混合推理與非選表達",
        weekend_geometry_mixed_reasoning: "週日圖形與混合推理"
      };
      let days = [];
      let questions = [];

      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;");
      }

      function answerText(answer) {
        if (Array.isArray(answer)) return answer.join("、");
        if (answer && typeof answer === "object") {
          return Object.entries(answer).map(([key, value]) => `${key}: ${value}`).join("；");
        }
        return String(answer ?? "");
      }

      function getDataUrls() {
        return window.location.protocol === "file:" ? [REMOTE_DATA_URL, LOCAL_DATA_URL] : [LOCAL_DATA_URL, REMOTE_DATA_URL];
      }

      async function loadBankData() {
        const errors = [];
        for (const url of getDataUrls()) {
          try {
            const response = await fetch(url);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            return await response.json();
          } catch (error) {
            errors.push(`${url}: ${error.message}`);
          }
        }
        throw new Error(errors.join("；"));
      }

      function renderStats() {
        const written = questions.filter((item) => item.question.requires_written_response).length;
        const approved = questions.filter((item) => item.question.status === "approved_for_app").length;
        const stats = [
          ["總題數", questions.length],
          ["任務日", days.length],
          ["文字作答", written],
          ["正式題", approved],
          ["狀態", "正式"]
        ];
        document.getElementById("summaryStats").innerHTML = stats
          .map(([label, value]) => `<div class="bank-stat"><span>${escapeHtml(label)}</span><strong>${escapeHtml(value)}</strong></div>`)
          .join("");
      }

      function renderFilters() {
        const types = Array.from(new Set(questions.map((item) => item.question.question_type))).sort();
        const tracks = Array.from(new Set(questions.map((item) => item.question.math_track))).sort();
        document.getElementById("typeFilter").innerHTML = '<option value="all">全部題型</option>' + types
          .map((type) => `<option value="${escapeHtml(type)}">${escapeHtml(type)}</option>`)
          .join("");
        document.getElementById("trackFilter").innerHTML = '<option value="all">全部 A/B</option>' + tracks
          .map((track) => `<option value="${escapeHtml(track)}">數學 ${escapeHtml(track)}</option>`)
          .join("");
      }

      function renderTable(material) {
        const columns = material.columns || [];
        const rows = material.rows || [];
        return `
          <table class="bank-table">
            <thead>
              <tr>
                <th>${escapeHtml(material.row_header || "")}</th>
                ${columns.map((column) => `<th>${escapeHtml(column)}</th>`).join("")}
              </tr>
            </thead>
            <tbody>
              ${rows.map((row) => `
                <tr>
                  <th>${escapeHtml(row.label || "")}</th>
                  ${(row.values || []).map((cell) => `<td>${escapeHtml(cell)}</td>`).join("")}
                </tr>
              `).join("")}
            </tbody>
          </table>
        `;
      }

      function formatMathText(value) {
        const raw = String(value || "");
        if (raw.includes("projection length")) return "正射影長 = (v · u) / |u|";
        if (raw.includes("x_{n+1}=0.7x_n+12")) return "xₙ₊₁ = 0.7xₙ + 12，x₀ = 100";
        if (raw.includes("begin{bmatrix}2&-1")) return "A = [[2, -1], [1, 3]]";
        if (raw.includes("120") && raw.includes("frac{6}{10}") && raw.includes("-20")) {
          return "E = 120 × 6/10 × 5/9 + 30 × (2 × 6/10 × 4/9) - 20";
        }
        return raw
          .replaceAll("\\\\", "\\")
          .replace(/\\text\{([^}]*)\}/g, "$1")
          .replace(/\\left/g, "")
          .replace(/\\right/g, "")
          .replace(/\\frac\{([^}]*)\}\{([^}]*)\}/g, "($1) / ($2)")
          .replace(/\\sqrt\{([^}]*)\}/g, "sqrt($1)")
          .replace(/\\begin\{bmatrix\}/g, "[")
          .replace(/\\end\{bmatrix\}/g, "]")
          .replace(/\\cdot/g, "·")
          .replace(/\\quad/g, "，")
          .replace(/\\le/g, "<=")
          .replace(/\\ge/g, ">=")
          .replace(/\\times/g, "×")
          .replace(/\^\{([^}]*)\}/g, "^$1")
          .replace(/_\{([^}]*)\}/g, "_$1")
          .replace(/\s+/g, " ")
          .trim();
      }

      function renderQuadraticGraph(spec) {
        const width = 520;
        const height = 260;
        const pad = 34;
        const xMin = -2;
        const xMax = 6;
        const yMin = -5;
        const yMax = 5;
        const xScale = (width - pad * 2) / (xMax - xMin);
        const yScale = (height - pad * 2) / (yMax - yMin);
        const mapX = (x) => pad + (x - xMin) * xScale;
        const mapY = (y) => height - pad - (y - yMin) * yScale;
        const clampY = (y) => Math.max(pad, Math.min(height - pad, mapY(y)));
        const vertex = spec.vertex || [2, -3];
        const h = Number(spec.h ?? vertex[0] ?? 2);
        const k = Number(spec.k ?? vertex[1] ?? -3);
        const a = Number(spec.a ?? (spec.opens === "down" ? -1 : 1));
        const points = [];
        for (let i = 0; i <= 80; i += 1) {
          const x = xMin + (xMax - xMin) * i / 80;
          const y = a * (x - h) ** 2 + k;
          points.push(`${mapX(x).toFixed(1)},${clampY(y).toFixed(1)}`);
        }
        const vertexX = mapX(vertex[0]);
        const vertexY = mapY(vertex[1]);
        const axisLabelY = spec.opens === "down" ? height - 44 : pad + 16;
        return `
          <svg class="math-graph" viewBox="0 0 ${width} ${height}" role="img" aria-label="拋物線 ${escapeHtml(spec.equation || "")}">
            <line x1="${pad}" y1="${mapY(0)}" x2="${width - pad}" y2="${mapY(0)}" stroke="#8aa2b2" stroke-width="1" />
            <line x1="${mapX(0)}" y1="${pad}" x2="${mapX(0)}" y2="${height - pad}" stroke="#8aa2b2" stroke-width="1" />
            <line x1="${mapX(h)}" y1="${pad}" x2="${mapX(h)}" y2="${height - pad}" stroke="#c2410c" stroke-width="1.5" stroke-dasharray="5 5" />
            <polyline points="${points.join(" ")}" fill="none" stroke="#155e75" stroke-width="3" stroke-linejoin="round" />
            <circle cx="${vertexX}" cy="${vertexY}" r="5" fill="#c2410c" />
            <text x="${vertexX + 16}" y="${vertexY - 14}" fill="#17212b" font-size="14">頂點 (${vertex.join(",")})</text>
            <text x="${mapX(h) + 16}" y="${axisLabelY}" fill="#c2410c" font-size="13">對稱軸 x=${h}</text>
            <text x="${pad}" y="${height - 8}" fill="#61707e" font-size="13">${escapeHtml(spec.equation || "")}</text>
          </svg>
        `;
      }

      function renderVectorProjectionGraph(spec) {
        const width = 520;
        const height = 300;
        const pad = 36;
        const max = 9;
        const scale = (height - pad * 2) / max;
        const origin = { x: pad, y: height - pad };
        const map = ([x, y]) => ({
          x: origin.x + x * scale,
          y: origin.y - y * scale
        });
        const v = spec.vectors?.v || [6, 8];
        const u = spec.vectors?.u || [4, 3];
        const projection = spec.projection_point || [7.68, 5.76];
        const ray = spec.ray_point || [u[0] * 2.15, u[1] * 2.15];
        const vPoint = map(v);
        const uPoint = map(u);
        const projectionPoint = map(projection);
        const rayPoint = map(ray);
        return `
          <svg class="math-graph" viewBox="0 0 ${width} ${height}" role="img" aria-label="向量投影示意圖">
            <defs>
              <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#155e75" />
              </marker>
              <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#c2410c" />
              </marker>
            </defs>
            <line x1="${origin.x}" y1="${origin.y}" x2="${width - pad}" y2="${origin.y}" stroke="#8aa2b2" />
            <line x1="${origin.x}" y1="${origin.y}" x2="${origin.x}" y2="${pad}" stroke="#8aa2b2" />
            <line x1="${origin.x}" y1="${origin.y}" x2="${rayPoint.x}" y2="${rayPoint.y}" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6 5" />
            <line x1="${origin.x}" y1="${origin.y}" x2="${vPoint.x}" y2="${vPoint.y}" stroke="#155e75" stroke-width="3" marker-end="url(#arrow-blue)" />
            <line x1="${origin.x}" y1="${origin.y}" x2="${uPoint.x}" y2="${uPoint.y}" stroke="#c2410c" stroke-width="3" marker-end="url(#arrow-orange)" />
            <line x1="${vPoint.x}" y1="${vPoint.y}" x2="${projectionPoint.x}" y2="${projectionPoint.y}" stroke="#64748b" stroke-width="2" stroke-dasharray="5 5" />
            <circle cx="${projectionPoint.x}" cy="${projectionPoint.y}" r="4" fill="#0f766e" />
            <text x="${vPoint.x + 8}" y="${vPoint.y - 8}" fill="#155e75" font-size="14">v=(${v.join(",")})</text>
            <text x="${uPoint.x + 8}" y="${uPoint.y + 18}" fill="#c2410c" font-size="14">u=(${u.join(",")})</text>
            <text x="${projectionPoint.x - 46}" y="${projectionPoint.y + 20}" fill="#0f766e" font-size="14">投影點</text>
            <text x="${pad}" y="${height - 8}" fill="#61707e" font-size="13">由圖判斷 v 沿 u 方向的投影長</text>
          </svg>
        `;
      }

      function renderLinearTransformMappingGraph(spec) {
        const width = 760;
        const height = 420;
        const panelWidth = 330;
        const panelHeight = 310;
        const leftPanel = { x: 42, y: 42 };
        const rightPanel = { x: 388, y: 42 };
        const sourceOrigin = { x: leftPanel.x + 72, y: leftPanel.y + 232 };
        const imageOrigin = { x: rightPanel.x + 82, y: rightPanel.y + 232 };
        const scale = 56;
        const imageScale = 44;
        const mapFrom = (origin, [x, y]) => ({
          x: origin.x + x * scale,
          y: origin.y - y * scale
        });
        const mapImage = (origin, [x, y]) => ({
          x: origin.x + x * imageScale,
          y: origin.y - y * imageScale
        });
        const sourceVectors = spec.source_vectors || {};
        const imageVectors = spec.image_vectors || {};
        const textBox = (x, y, text, color, width = 84) => `
          <rect x="${x - 5}" y="${y - 17}" width="${width}" height="23" rx="5" fill="#ffffff" stroke="rgba(15,23,42,0.08)" />
          <text x="${x}" y="${y}" fill="${color}" font-size="14" font-weight="800">${escapeHtml(text)}</text>
        `;
        const vectorLine = (origin, mapper, point, color, marker, labelX, labelY, label, boxWidth = 86) => {
          const mapped = mapper(origin, point);
          return `
            <line x1="${origin.x}" y1="${origin.y}" x2="${mapped.x}" y2="${mapped.y}" stroke="${color}" stroke-width="3" marker-end="url(#${marker})" />
            <circle cx="${mapped.x}" cy="${mapped.y}" r="4" fill="${color}" />
            ${textBox(labelX, labelY, label, color, boxWidth)}
          `;
        };
        const axis = (panel, origin, title) => `
          <rect x="${panel.x}" y="${panel.y}" width="${panelWidth}" height="${panelHeight}" rx="10" fill="#ffffff" stroke="rgba(21,94,117,0.2)" />
          <line x1="${origin.x - 34}" y1="${origin.y}" x2="${panel.x + panelWidth - 30}" y2="${origin.y}" stroke="#8aa2b2" />
          <line x1="${origin.x}" y1="${origin.y + 34}" x2="${origin.x}" y2="${panel.y + 56}" stroke="#8aa2b2" />
          <text x="${panel.x + 22}" y="${panel.y + 32}" fill="#17212b" font-size="16" font-weight="800">${title}</text>
        `;
        return `
          <svg class="math-graph" viewBox="0 0 ${width} ${height}" role="img" aria-label="線性變換示意圖">
            <defs>
              <marker id="arrow-lt-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#155e75" />
              </marker>
              <marker id="arrow-lt-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#c2410c" />
              </marker>
              <marker id="arrow-lt-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e" />
              </marker>
            </defs>
            ${axis(leftPanel, sourceOrigin, "原坐標平面")}
            ${axis(rightPanel, imageOrigin, "變換後平面")}
            ${vectorLine(sourceOrigin, mapFrom, sourceVectors.a || [1, 1], "#155e75", "arrow-lt-blue", leftPanel.x + 164, leftPanel.y + 95, "a=(1,1)", 78)}
            ${vectorLine(sourceOrigin, mapFrom, sourceVectors.b || [1, -1], "#c2410c", "arrow-lt-orange", leftPanel.x + 164, leftPanel.y + 292, "b=(1,-1)", 86)}
            ${vectorLine(sourceOrigin, mapFrom, sourceVectors.w || [3, 1], "#0f766e", "arrow-lt-green", leftPanel.x + 236, leftPanel.y + 130, "w=(3,1)", 82)}
            ${vectorLine(imageOrigin, mapImage, imageVectors["T(a)"] || [4, 2], "#155e75", "arrow-lt-blue", rightPanel.x + 208, rightPanel.y + 94, "T(a)=(4,2)", 104)}
            ${vectorLine(imageOrigin, mapImage, imageVectors["T(b)"] || [0, 2], "#c2410c", "arrow-lt-orange", rightPanel.x + 42, rightPanel.y + 94, "T(b)=(0,2)", 104)}
            ${textBox(rightPanel.x + 194, rightPanel.y + 174, "T(w)=?", "#0f766e", 78)}
            <text x="42" y="392" fill="#61707e" font-size="13">圖中只給已知向量與已知變換結果；目標 T(3,1) 需自行推理。</text>
          </svg>
        `;
      }

      function renderBasisTransformAreaGraph(spec) {
        const width = 760;
        const height = 400;
        const leftPanel = { x: 42, y: 38 };
        const rightPanel = { x: 388, y: 38 };
        const panelWidth = 330;
        const panelHeight = 270;
        const sourceOrigin = { x: leftPanel.x + 82, y: leftPanel.y + 202 };
        const imageOrigin = { x: rightPanel.x + 136, y: rightPanel.y + 202 };
        const scale = 68;
        const imageScale = 54;
        const map = (origin, s, [x, y]) => ({ x: origin.x + x * s, y: origin.y - y * s });
        const legendItem = (x, y, label, color, width = 92) => `
          <rect x="${x - 5}" y="${y - 17}" width="${width}" height="23" rx="5" fill="#ffffff" stroke="rgba(15,23,42,0.08)" />
          <circle cx="${x + 8}" cy="${y - 6}" r="4" fill="${color}" />
          <text x="${x + 18}" y="${y}" fill="${color}" font-size="14" font-weight="800">${escapeHtml(label)}</text>
        `;
        const axis = (panel, origin, title) => `
          <rect x="${panel.x}" y="${panel.y}" width="${panelWidth}" height="${panelHeight}" rx="10" fill="#ffffff" stroke="rgba(21,94,117,0.2)" />
          <line x1="${origin.x - 42}" y1="${origin.y}" x2="${panel.x + panelWidth - 28}" y2="${origin.y}" stroke="#8aa2b2" />
          <line x1="${origin.x}" y1="${origin.y + 32}" x2="${origin.x}" y2="${panel.y + 54}" stroke="#8aa2b2" />
          <text x="${panel.x + 22}" y="${panel.y + 32}" fill="#17212b" font-size="16" font-weight="800">${title}</text>
        `;
        const poly = (origin, s, vectors, fill, stroke) => {
          const a = vectors[0];
          const b = vectors[1];
          const pts = [[0, 0], a, [a[0] + b[0], a[1] + b[1]], b].map((p) => map(origin, s, p));
          return `<polygon points="${pts.map((p) => `${p.x},${p.y}`).join(" ")}" fill="${fill}" stroke="${stroke}" stroke-width="2.5" />`;
        };
        const line = (origin, s, point, color) => {
          const p = map(origin, s, point);
          return `<line x1="${origin.x}" y1="${origin.y}" x2="${p.x}" y2="${p.y}" stroke="${color}" stroke-width="3" marker-end="url(#arrow-area-${color.replace("#", "")})" />`;
        };
        const e1 = spec.source_vectors?.e1 || [1, 0];
        const e2 = spec.source_vectors?.e2 || [0, 1];
        const te1 = spec.image_vectors?.["T(e1)"] || [2, 1];
        const te2 = spec.image_vectors?.["T(e2)"] || [-1, 3];
        return `
          <svg class="math-graph" viewBox="0 0 ${width} ${height}" role="img" aria-label="基底向量變換示意圖">
            <defs>
              <marker id="arrow-area-155e75" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#155e75" /></marker>
              <marker id="arrow-area-c2410c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c2410c" /></marker>
            </defs>
            ${axis(leftPanel, sourceOrigin, "原基底")}
            ${axis(rightPanel, imageOrigin, "變換後")}
            ${poly(sourceOrigin, scale, [e1, e2], "rgba(21,94,117,0.12)", "#155e75")}
            ${poly(imageOrigin, imageScale, [te1, te2], "rgba(194,65,12,0.12)", "#c2410c")}
            ${line(sourceOrigin, scale, e1, "#155e75")}
            ${line(sourceOrigin, scale, e2, "#c2410c")}
            ${line(imageOrigin, imageScale, te1, "#155e75")}
            ${line(imageOrigin, imageScale, te2, "#c2410c")}
            ${legendItem(52, 338, `e1=(${e1.join(",")})`, "#155e75", 94)}
            ${legendItem(164, 338, `e2=(${e2.join(",")})`, "#c2410c", 94)}
            ${legendItem(286, 338, `T(e1)=(${te1.join(",")})`, "#155e75", 124)}
            ${legendItem(430, 338, `T(e2)=(${te2.join(",")})`, "#c2410c", 138)}
            <text x="42" y="380" fill="#61707e" font-size="13">det(A) 可視為單位方格經變換後的有向面積倍率。</text>
          </svg>
        `;
      }

      function renderQuadraticRootsDistanceGraph(spec) {
        const width = 760;
        const height = 330;
        const pad = 44;
        const axisValue = Number(spec.axis_value ?? String(spec.axis || "x=2").replace("x=", "")) || 2;
        const xMin = axisValue - 5;
        const xMax = axisValue + 5;
        const yMin = -5;
        const yMax = 7;
        const mapX = (x) => pad + (x - xMin) * (width - pad * 2) / (xMax - xMin);
        const mapY = (y) => height - pad - (y - yMin) * (height - pad * 2) / (yMax - yMin);
        const clampY = (y) => Math.max(pad, Math.min(height - pad, mapY(y)));
        const points = [];
        for (let i = 0; i <= 100; i += 1) {
          const x = xMin + (xMax - xMin) * i / 100;
          const y = (x - axisValue) ** 2 - 4;
          points.push(`${mapX(x).toFixed(1)},${clampY(y).toFixed(1)}`);
        }
        const leftRoot = mapX(axisValue - 2);
        const rightRoot = mapX(axisValue + 2);
        const axisX = mapX(axisValue);
        const axisY = mapY(0);
        const distanceLabel = (spec.condition || "").match(/兩交點距離小於\s*\d+/)?.[0] || "兩交點距離限制";
        return `
          <svg class="math-graph" viewBox="0 0 ${width} ${height}" role="img" aria-label="二次函數與 x 軸交點距離示意">
            <rect x="18" y="20" width="${width - 36}" height="${height - 54}" rx="10" fill="#ffffff" stroke="rgba(21,94,117,0.18)" />
            <line x1="${pad}" y1="${axisY}" x2="${width - pad}" y2="${axisY}" stroke="#8aa2b2" />
            <line x1="${mapX(0)}" y1="${pad}" x2="${mapX(0)}" y2="${height - pad}" stroke="#8aa2b2" />
            <line x1="${axisX}" y1="${pad}" x2="${axisX}" y2="${height - pad}" stroke="#c2410c" stroke-width="1.5" stroke-dasharray="6 5" />
            <polyline points="${points.join(" ")}" fill="none" stroke="#155e75" stroke-width="3" stroke-linejoin="round" />
            <line x1="${leftRoot}" y1="${axisY - 18}" x2="${rightRoot}" y2="${axisY - 18}" stroke="#0f766e" stroke-width="3" />
            <circle cx="${leftRoot}" cy="${axisY}" r="4" fill="#0f766e" />
            <circle cx="${rightRoot}" cy="${axisY}" r="4" fill="#0f766e" />
            <rect x="${axisX + 10}" y="${pad + 8}" width="84" height="24" rx="5" fill="#ffffff" stroke="rgba(15,23,42,0.08)" />
            <text x="${axisX + 15}" y="${pad + 26}" fill="#c2410c" font-size="14" font-weight="800">對稱軸 x=${axisValue}</text>
            <rect x="${axisX - 72}" y="${axisY - 52}" width="160" height="25" rx="5" fill="#ffffff" stroke="rgba(15,23,42,0.08)" />
            <text x="${axisX - 66}" y="${axisY - 34}" fill="#0f766e" font-size="14" font-weight="800">${escapeHtml(distanceLabel)}</text>
            <text x="42" y="${height - 12}" fill="#61707e" font-size="13">${escapeHtml(spec.family || "f(x)=x^2-4x+k")} 的圖形會隨 k 上下平移。</text>
          </svg>
        `;
      }

      function renderTriangleTransformGraph(spec) {
        const width = 520;
        const height = 390;
        const plotHeight = 320;
        const pad = 38;
        const points = spec.points || {};
        const transformed = {};
        Object.entries(points).forEach(([name, point]) => {
          const [x, y] = point;
          transformed[`${name}'`] = [2 * x - y, x + y];
        });
        const allPoints = [...Object.values(points), ...Object.values(transformed)];
        const xs = allPoints.map((point) => point[0]);
        const ys = allPoints.map((point) => point[1]);
        const xMin = Math.min(-1, ...xs) - 1;
        const xMax = Math.max(8, ...xs) + 1;
        const yMin = Math.min(0, ...ys) - 1;
        const yMax = Math.max(10, ...ys) + 1;
        const map = ([x, y]) => ({
          x: pad + (x - xMin) * (width - pad * 2) / (xMax - xMin),
          y: plotHeight - pad - (y - yMin) * (plotHeight - pad * 2) / (yMax - yMin)
        });
        const polygon = (shape) => Object.values(shape).map((point) => {
          const mapped = map(point);
          return `${mapped.x.toFixed(1)},${mapped.y.toFixed(1)}`;
        }).join(" ");
        const dots = (shape, color) => Object.entries(shape).map(([, point]) => {
          const mapped = map(point);
          return `<circle cx="${mapped.x}" cy="${mapped.y}" r="4.5" fill="${color}" />`;
        }).join("");
        const legend = (x, y, color, text, width) => `
          <rect x="${x}" y="${y - 16}" width="${width}" height="24" rx="5" fill="#ffffff" stroke="rgba(15,23,42,0.08)" />
          <circle cx="${x + 10}" cy="${y - 5}" r="4" fill="${color}" />
          <text x="${x + 20}" y="${y}" fill="${color}" font-size="13" font-weight="800">${escapeHtml(text)}</text>
        `;
        return `
          <svg class="math-graph" viewBox="0 0 ${width} ${height}" role="img" aria-label="三角形線性變換示意圖">
            <line x1="${pad}" y1="${map([0, 0]).y}" x2="${width - pad}" y2="${map([0, 0]).y}" stroke="#8aa2b2" />
            <line x1="${map([0, 0]).x}" y1="${pad}" x2="${map([0, 0]).x}" y2="${height - pad}" stroke="#8aa2b2" />
            <polygon points="${polygon(points)}" fill="rgba(21,94,117,0.12)" stroke="#155e75" stroke-width="2.5" />
            <polygon points="${polygon(transformed)}" fill="rgba(194,65,12,0.12)" stroke="#c2410c" stroke-width="2.5" />
            ${dots(points, "#155e75")}
            ${dots(transformed, "#c2410c")}
            ${legend(38, 332, "#155e75", `原三角形：${Object.entries(points).map(([name, point]) => `${name}(${point.join(",")})`).join("、")}`, 296)}
            ${legend(38, 362, "#c2410c", `變換後：${Object.entries(transformed).map(([name, point]) => `${name}(${point.join(",")})`).join("、")}`, 356)}
          </svg>
        `;
      }

      function renderParallelepipedGraph(spec) {
        const width = 520;
        const height = 390;
        const add = (a, b) => a.map((value, index) => value + b[index]);
        const points = spec.points || {};
        const A = points.A || [0, 0, 0];
        const B = points.B || [2, 1, 0];
        const D = points.D || [1, 3, 0];
        const P = points.P || [1, 1, 4];
        const nodes = {
          A,
          B,
          D,
          P,
          C: add(B, D),
          Q: add(B, P),
          R: add(D, P),
          S: add(add(B, D), P)
        };
        const rawProject = ([x, y, z]) => ({
          x: x * 54 + y * 26,
          y: -x * 8 - y * 18 - z * 32
        });
        const projectedNodes = Object.fromEntries(
          Object.entries(nodes).map(([name, point]) => [name, rawProject(point)])
        );
        const graphBounds = Object.values(projectedNodes).reduce((bounds, point) => ({
          minX: Math.min(bounds.minX, point.x),
          maxX: Math.max(bounds.maxX, point.x),
          minY: Math.min(bounds.minY, point.y),
          maxY: Math.max(bounds.maxY, point.y)
        }), { minX: Infinity, maxX: -Infinity, minY: Infinity, maxY: -Infinity });
        const graphBox = { x: 38, y: 34, width: width - 76, height: 250 };
        const graphScale = Math.min(
          graphBox.width / Math.max(1, graphBounds.maxX - graphBounds.minX),
          graphBox.height / Math.max(1, graphBounds.maxY - graphBounds.minY)
        ) * 0.88;
        const graphOffset = {
          x: graphBox.x + (graphBox.width - (graphBounds.maxX - graphBounds.minX) * graphScale) / 2 - graphBounds.minX * graphScale,
          y: graphBox.y + (graphBox.height - (graphBounds.maxY - graphBounds.minY) * graphScale) / 2 - graphBounds.minY * graphScale
        };
        const project = (pointOrName) => {
          const raw = typeof pointOrName === "string" ? projectedNodes[pointOrName] : rawProject(pointOrName);
          return {
            x: graphOffset.x + raw.x * graphScale,
            y: graphOffset.y + raw.y * graphScale
          };
        };
        const line = (from, to, color = "#155e75", dash = "") => {
          const a = project(from);
          const b = project(to);
          return `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${color}" stroke-width="2.5" ${dash ? `stroke-dasharray="${dash}"` : ""} />`;
        };
        const dot = (point) => {
          const p = project(point);
          return `<circle cx="${p.x}" cy="${p.y}" r="4.5" fill="#c2410c" />`;
        };
        const legend = (x, y, text, width) => `
          <rect x="${x}" y="${y - 16}" width="${width}" height="24" rx="5" fill="#ffffff" stroke="rgba(15,23,42,0.08)" />
          <circle cx="${x + 10}" cy="${y - 5}" r="4" fill="#c2410c" />
          <text x="${x + 20}" y="${y}" fill="#17212b" font-size="13" font-weight="800">${escapeHtml(text)}</text>
        `;
        return `
          <svg class="math-graph" viewBox="0 0 ${width} ${height}" role="img" aria-label="平行六面體示意圖">
            ${line("A", "B")}
            ${line("A", "D")}
            ${line("B", "C")}
            ${line("D", "C")}
            ${line("A", "P", "#c2410c")}
            ${line("B", "Q")}
            ${line("D", "R")}
            ${line("C", "S")}
            ${line("P", "Q")}
            ${line("P", "R")}
            ${line("Q", "S")}
            ${line("R", "S")}
            ${line("B", "D", "#94a3b8", "5 5")}
            ${dot(A)}
            ${dot(B)}
            ${dot(D)}
            ${dot(P)}
            ${legend(38, 322, `A(${A.join(",")})、B(${B.join(",")})、D(${D.join(",")})`, 294)}
            ${legend(38, 352, `P(${P.join(",")})；以 AB、AD、AP 為三邊`, 300)}
          </svg>
        `;
      }

      function renderSpecSummary(material) {
        const spec = material.spec || {};
        if (material.type === "graph_spec" && spec.type === "quadratic") {
          const openingText = spec.opens === "up" ? "向上" : spec.opens === "down" ? "向下" : spec.opens || "未標";
          return `
            <p>拋物線：${escapeHtml(spec.equation || "")}</p>
            <p>頂點：(${escapeHtml((spec.vertex || []).join(","))})；開口：${escapeHtml(openingText)}</p>
            ${renderQuadraticGraph(spec)}
          `;
        }
        if (material.type === "graph_spec" && spec.type === "quadratic_roots_distance") {
          return `
            <p>${escapeHtml(spec.condition || "觀察二次函數與 x 軸交點。")}</p>
            ${renderQuadraticRootsDistanceGraph(spec)}
          `;
        }
        if (material.type === "diagram_spec" && spec.type === "vector_projection") {
          const v = spec.vectors?.v || [6, 8];
          const u = spec.vectors?.u || [4, 3];
          return `
            <p>向量 v=(${escapeHtml(v.join(","))})，方向向量 u=(${escapeHtml(u.join(","))})。</p>
            ${renderVectorProjectionGraph(spec)}
          `;
        }
        if (material.type === "diagram_spec" && spec.type === "linear_transform_mapping") {
          return `
            <p>比較原向量與變換後向量，判斷目標向量的變換結果。</p>
            ${renderLinearTransformMappingGraph(spec)}
          `;
        }
        if (material.type === "diagram_spec" && spec.type === "basis_transform_area") {
          return `
            <p>觀察基底向量變換後形成的平行四邊形。</p>
            ${renderBasisTransformAreaGraph(spec)}
          `;
        }
        if (material.type === "diagram_spec" && spec.transform && spec.points) {
          return `
            <p>原圖形與變換後圖形如下。</p>
            ${renderTriangleTransformGraph(spec)}
          `;
        }
        if (material.type === "diagram_spec" && spec.vectors_from_A && spec.points) {
          return `
            <p>由同一頂點 A 出發的三個向量形成平行六面體。</p>
            ${renderParallelepipedGraph(spec)}
          `;
        }
        const items = [];
        if (spec.transform) items.push(`變換：${spec.transform}`);
        if (spec.points) {
          Object.entries(spec.points).forEach(([name, point]) => {
            items.push(`${name} 點：(${point.join(",")})`);
          });
        }
        if (spec.vectors_from_A) items.push(`從 A 出發的向量：${spec.vectors_from_A.join("、")}`);
        if (spec.segments) items.push(`線段：${spec.segments.map((segment) => segment.join("")).join("、")}`);
        return `<ul class="math-spec-list">${items.map((item) => `<li>${escapeHtml(item)}</li>`).join("")}</ul>`;
      }

      function renderMaterial(material) {
        if (material.type === "table") {
          return `
            <section class="bank-material">
              <strong>${escapeHtml(material.title || "資料表")}</strong>
              ${renderTable(material)}
            </section>
          `;
        }
        if (material.type === "latex") {
          return `
            <section class="bank-material">
              <strong>${escapeHtml(material.title || "公式")}</strong>
              <div class="math-readable">${escapeHtml(formatMathText(material.content || ""))}</div>
            </section>
          `;
        }
        if (material.type === "diagram_spec" || material.type === "graph_spec") {
          return `
            <section class="bank-material">
              <strong>${escapeHtml(material.title || "圖形說明")}</strong>
              ${renderSpecSummary(material)}
            </section>
          `;
        }
        return `
          <section class="bank-material">
            <strong>${escapeHtml(material.title || "材料")}</strong>
            <p>${escapeHtml(material.content || "")}</p>
          </section>
        `;
      }

      function renderQuestion(item, index) {
        const question = item.question;
        const statusText = statusLabels[question.status] || question.status || "未標";
        const options = question.options && question.options.length
          ? `<ul class="bank-options">${question.options.map((option) => `<li><strong>${escapeHtml(option.key)}</strong>${escapeHtml(option.text)}</li>`).join("")}</ul>`
          : '<p class="bank-empty">選填或短答題，無選項。</p>';
        return `
          <article class="bank-question" data-weekday="${item.weekday}" data-type="${escapeHtml(question.question_type)}" data-track="${escapeHtml(question.math_track)}">
            <div class="bank-question-header">
              <div class="social-tags">
                <span class="tag">${escapeHtml(question.id)}</span>
                <span class="tag">${escapeHtml(question.question_type)}</span>
                <span class="tag">數學 ${escapeHtml(question.math_track)}</span>
                <span class="tag">${escapeHtml(question.difficulty)}</span>
                <span class="tag">${question.status === "not_online" ? "未上線" : "正式題"}</span>
              </div>
              <span class="bank-status">${escapeHtml(statusText)}</span>
            </div>
            <p class="label">${escapeHtml(weekdayLabels[item.weekday] || item.weekday)} 第 ${index + 1} 題</p>
            <div>${escapeHtml(question.stem)}</div>
            ${(question.materials || []).map(renderMaterial).join("")}
            ${options}
            <details class="bank-answer">
              <summary>查看答案與解析</summary>
              <p><strong>答案：</strong>${escapeHtml(answerText(question.answer))}</p>
              ${question.scoring_rule ? `<p><strong>評分規準：</strong>${escapeHtml(question.scoring_rule)}</p>` : ""}
              <p><strong>解析：</strong>${escapeHtml(question.explanation)}</p>
              <p><strong>複習建議：</strong>${escapeHtml(question.review_advice)}</p>
            </details>
            <div class="bank-review">
              <p><strong>知識標籤：</strong>${escapeHtml((question.knowledge_tags || []).join("、"))}</p>
              <p><strong>能力標籤：</strong>${escapeHtml((question.ability_tags || []).join("、"))}</p>
              <p><strong>審題紀錄：</strong>${escapeHtml((question.review_notes || []).join(" "))}</p>
              <p><strong>相似風險：</strong>${escapeHtml(question.similarity_risk || "未標")}</p>
            </div>
          </article>
        `;
      }

      function renderDay(day) {
        const dayQuestions = day.question_slots || [];
        const statusText = statusLabels[day.status] || day.status || "未標";
        return `
          <section class="bank-day" data-weekday="${day.weekday}">
            <div class="bank-day-header">
              <div>
                <p class="eyebrow">${escapeHtml(day.day_id)}</p>
                <h2>${escapeHtml(day.label)}：${escapeHtml(taskTypeLabels[day.task_type] || day.task_type)}</h2>
              </div>
              <span class="bank-status">${escapeHtml(statusText)}</span>
            </div>
            ${(day.day_materials || []).map(renderMaterial).join("")}
            <div class="bank-list">
              ${dayQuestions.map((question, index) => renderQuestion({ weekday: day.weekday, question }, index)).join("")}
            </div>
          </section>
        `;
      }

      function renderList() {
        const weekday = document.getElementById("weekdayFilter").value;
        const type = document.getElementById("typeFilter").value;
        const track = document.getElementById("trackFilter").value;
        const filteredDays = days
          .filter((day) => weekday === "all" || day.weekday === weekday)
          .map((day) => ({
            ...day,
            question_slots: day.question_slots.filter((question) => {
              const typeMatch = type === "all" || question.question_type === type;
              const trackMatch = track === "all" || question.math_track === track;
              return typeMatch && trackMatch;
            })
          }))
          .filter((day) => day.question_slots.length);
        document.getElementById("bankList").innerHTML = filteredDays.length
          ? filteredDays.map(renderDay).join("")
          : '<div class="bank-empty">沒有符合條件的題目。</div>';
      }

      async function init() {
        const data = await loadBankData();
        document.getElementById("pageTitle").textContent = "數學正式題庫";
        document.title = "AI學測考總複習｜數學正式題庫";
        document.getElementById("statusTitle").textContent = "數學正式題庫已整理完成";
        document.getElementById("statusCopy").textContent = data.meta?.source_policy || "本檔為數學科單一正式題庫，已接入正式闖關。";
        days = (data.weeks || []).flatMap((week) => week.days || []);
        questions = days.flatMap((day) => (day.question_slots || []).map((question) => ({ weekday: day.weekday, question })));
        renderStats();
        renderFilters();
        renderList();
        document.getElementById("weekdayFilter").addEventListener("change", renderList);
        document.getElementById("trackFilter").addEventListener("change", renderList);
        document.getElementById("typeFilter").addEventListener("change", renderList);
      }

      init().catch((error) => {
        document.querySelector(".bank-shell").innerHTML = `
          <section class="error-box">
            <h1>數學題庫讀取失敗</h1>
            <p>${escapeHtml(error.message)}</p>
          </section>
        `;
      });
    </script>
  </body>
</html>
