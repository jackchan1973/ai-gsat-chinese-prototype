<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI學測考總複習｜國文解析</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="../assets/css/style.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">國文今日任務</p>
          <h1>作答解析</h1>
        </div>
        <a class="text-link" href="../index.html">回今日任務</a>
      </header>

      <section class="summary-grid review-summary" aria-label="作答摘要">
        <article class="summary-panel main-summary">
          <div class="panel-heading">
            <p class="label">任務</p>
            <strong id="reviewDate">--</strong>
          </div>
          <div class="hero-task">
            <h2 id="reviewTitle">讀取作答結果</h2>
            <p id="reviewMeta">請稍候</p>
          </div>
        </article>
        <article class="summary-panel metric-panel">
          <p class="label">自動評分</p>
          <strong id="autoScore">--</strong>
          <span>題答對</span>
        </article>
        <article class="summary-panel metric-panel">
          <p class="label">待 AI 評分</p>
          <strong id="pendingScore">--</strong>
          <span>題短答</span>
        </article>
        <article class="summary-panel metric-panel">
          <p class="label">錯題</p>
          <strong id="wrongCount">--</strong>
          <span>題</span>
        </article>
      </section>

      <section class="panel wide-panel">
        <div class="section-title">
          <h2>逐題解析</h2>
          <span id="reviewStatus">--</span>
        </div>
        <div class="review-stack" id="reviewStack"></div>
      </section>
    </main>

    <script src="../assets/js/session.js?v=20260804-portal-login"></script>
    <script src="../assets/js/review.js?v=20260804-class-1105"></script>
  </body>
</html>
