<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI學測考總複習｜英文科闖關</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="../assets/css/style.css?v=20260815-ui06" />
    <style>
      .english-practice-page {
        background: linear-gradient(180deg, #14304c 0, #214f6a 220px, #f3f7fb 220px, #f3f7fb 100%);
      }

      .english-practice-shell {
        max-width: 1120px;
      }

      .english-practice-page .topbar {
        align-items: center;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 8px;
        padding: 20px;
        background: linear-gradient(135deg, rgba(10, 32, 55, 0.96), rgba(27, 98, 118, 0.88));
        color: #fff;
      }

      .english-practice-page .topbar h1,
      .english-practice-page .topbar .eyebrow {
        color: #fff;
      }

      .english-practice-page .topbar .muted-text {
        color: rgba(255, 255, 255, 0.78);
      }

      .english-practice-page .topbar .secondary-action {
        border-color: rgba(255, 255, 255, 0.28);
        background: rgba(255, 255, 255, 0.12);
        color: #fff;
      }

      .english-practice-summary,
      .english-day-tabs,
      .english-material,
      .english-question-card,
      .english-score-panel {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        box-shadow: var(--shadow);
      }

      .english-practice-summary {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 10px;
        margin: 16px 0;
        padding: 14px;
      }

      .english-practice-summary div {
        border: 1px solid rgba(8, 104, 132, 0.14);
        border-radius: 8px;
        padding: 12px;
        background: #f7fbfd;
      }

      .english-practice-summary span {
        display: block;
        color: var(--muted);
        font-size: 0.86rem;
      }

      .english-practice-summary strong {
        display: block;
        margin-top: 4px;
        color: var(--primary-dark);
        font-size: 1.4rem;
      }

      .english-day-tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 16px;
        padding: 12px;
      }

      .english-day-tab {
        min-height: 48px;
        border: 1px solid rgba(8, 104, 132, 0.18);
        border-radius: 8px;
        padding: 8px 12px;
        background: #fff;
        color: var(--ink);
        cursor: pointer;
        font: inherit;
        text-align: left;
      }

      .english-day-tab.active {
        border-color: rgba(0, 167, 200, 0.7);
        background: linear-gradient(135deg, #00a7c8, #0f6f8d);
        color: #fff;
      }

      .english-day-tab span,
      .english-day-tab small {
        display: block;
      }

      .english-status {
        display: inline-flex;
        align-items: center;
        min-height: 30px;
        border: 1px solid rgba(21, 94, 117, 0.24);
        border-radius: 999px;
        padding: 4px 10px;
        background: #edf7fb;
        color: var(--primary);
        font-size: 0.86rem;
      }

      .english-material {
        margin-bottom: 14px;
        padding: 16px;
      }

      .english-material h3 {
        margin-top: 0;
      }

      .english-material p {
        white-space: pre-line;
      }

      .english-translation {
        margin-top: 12px;
        border: 1px solid rgba(29, 78, 216, .16);
        border-radius: 8px;
        background: #f8fbff;
        color: var(--muted);
        display: none;
      }

      body.answered .english-translation {
        display: block;
      }

      .english-translation summary {
        cursor: pointer;
        padding: 10px 12px;
        color: var(--primary);
        font-weight: 900;
      }

      .english-translation p {
        padding: 0 12px 12px;
      }

      .cloze-blank {
        display: inline-block;
        min-width: 3.4em;
        text-align: center;
        border-bottom: 1.6px solid #1f2937;
        font-weight: 700;
        color: var(--primary);
        padding: 0 .35em;
        margin: 0 .12em;
        line-height: 1.3;
      }

      .english-question-list {
        display: grid;
        gap: 14px;
      }

      .english-question-card {
        padding: 16px;
      }

      .english-question-card.correct {
        border-color: rgba(22, 163, 74, 0.4);
      }

      .english-question-card.incorrect {
        border-color: rgba(220, 38, 38, 0.38);
      }

      .english-question-header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 10px;
      }

      .english-option-list {
        display: grid;
        gap: 8px;
        margin: 12px 0;
      }

      .english-option {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px 12px;
        background: #f7fbfd;
      }

      .english-option input {
        margin-top: 4px;
      }

      .english-written {
        width: 100%;
        min-height: 130px;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px 12px;
        resize: vertical;
        font: inherit;
      }

      .english-answer-panel {
        display: none;
        margin-top: 12px;
        border: 1px solid rgba(3, 96, 121, 0.14);
        border-radius: 8px;
        padding: 12px;
        background: #f7fbfd;
      }

      .english-practice-page.answered .english-answer-panel {
        display: block;
      }

      .english-score-panel {
        display: none;
        margin: 16px 0;
        padding: 16px;
      }

      .english-score-panel.show {
        display: block;
      }

      .english-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin: 16px 0;
      }

      @media (max-width: 760px) {
        .english-practice-summary {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .english-practice-page .topbar,
        .english-question-header {
          align-items: flex-start;
          flex-direction: column;
        }
      }
    </style>
    <link rel="stylesheet" href="../assets/css/ui-refresh.css?v=20260815-ui06" />
  </head>
  <body class="english-practice-page ui-hero-bg">
    <main class="app-shell english-practice-shell">
      <header class="topbar app-hero">
        <div>
          <p class="eyebrow">English mainline</p>
          <h1>英文正式三天</h1>
          <p class="muted-text">週一做詞彙短讀，週四做克漏字與篇章結構，週日完成閱讀推論與寫作整合。</p>
        </div>
        <a class="home-return-action" href="../index.html">返回闖關地圖</a>
      </header>

      <section class="english-practice-summary" id="summaryStats" aria-label="英文練習統計"></section>
      <details class="quest-picker" id="questPicker">
        <summary class="quest-picker-summary">
          <span class="qp-eyebrow">目前關卡</span>
          <strong class="qp-current" id="questPickerCurrent">選擇關卡</strong>
          <span class="qp-toggle">切換關卡 <span class="qp-caret">▾</span></span>
        </summary>
        <section class="english-day-tabs" id="dayTabs" aria-label="選擇英文練習日"></section>
      </details>
      <form id="englishPracticeForm">
        <article class="english-material english-day-intro" id="dayIntro"></article>
        <div id="daySections" aria-live="polite"></div>
        <div class="english-actions">
          <button class="primary-action" type="submit">完成本關看結算</button>
          <button class="secondary-action" type="button" id="resetButton">重挑本關</button>
          <a class="secondary-action link-action" href="./english-bank.html">查看正式題庫</a>
        </div>
      </form>
      <section class="english-score-panel" id="scorePanel" aria-live="polite"></section>
      <a class="floating-home" href="../index.html" aria-label="返回主頁">← 返回主頁</a>
    </main>

    <script>
      const LOCAL_DATA_URL = "../../data/banks/english.json?v=20260815-ui06";
      const REMOTE_DATA_URL = "http://139.224.229.242/data/banks/english.json?v=20260815-ui06";
      const dayNames = { Mon: "週一", Thu: "週四", Sun: "週日" };
      const taskTypeLabels = {
        vocabulary_and_short_reading: "詞彙語境關",
        cloze_and_discourse: "克漏字結構關",
        reading_and_inference: "閱讀推論關",
        translation_writing_integration: "寫作整合關",
        weekend_reading_writing_integration: "閱讀寫作整合關"
      };
      const focusLabels = {
        "EN-VOC": "詞彙語境",
        "EN-CONTEXT": "語境判斷",
        "EN-READ": "閱讀理解",
        "EN-CLOZE": "綜合測驗",
        "EN-DISCOURSE": "篇章結構",
        "EN-INFER": "推論判斷",
        "EN-WRITE": "寫作表達",
        "EN-TRANSLATION": "翻譯判斷"
      };

      let days = [];
      let activeDayId = "";

      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#39;");
      }

      function answerText(answer) {
        return Array.isArray(answer) ? answer.join("、") : String(answer || "");
      }

      function focusText(focus) {
        if (Array.isArray(focus)) return focus.map((item) => focusLabels[item] || item).join("、");
        return focusLabels[focus] || focus || "依英文材料完成本關挑戰。";
      }

      function getDataUrls() {
        return window.location.protocol === "file:" ? [REMOTE_DATA_URL, LOCAL_DATA_URL] : [LOCAL_DATA_URL, REMOTE_DATA_URL];
      }

      async function loadData() {
        const errors = [];
        for (const url of getDataUrls()) {
          try {
            const response = await fetch(url);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            return await response.json();
          } catch (error) {
            errors.push(`${url}: ${error.message}`);
          }
        }
        throw new Error(errors.join("；"));
      }

      function renderStats() {
        const questions = days.flatMap((day) => day.question_slots || []);
        const written = questions.filter((question) => question.requires_written_response).length;
        const minutes = days.reduce((sum, day) => sum + Number(day.estimated_minutes || 0), 0);
        const stats = [
          ["關卡", days.length],
          ["總題數", questions.length],
          ["選擇挑戰", questions.length - written],
          ["預估分鐘", minutes],
          ["寫作關", written]
        ];
        document.getElementById("summaryStats").innerHTML = stats
          .map(([label, value]) => `<div><span>${label}</span><strong>${value}</strong></div>`)
          .join("");
      }

      function renderTabs() {
        document.getElementById("dayTabs").innerHTML = days
          .map((day, index) => `
            <button class="english-day-tab${day.day_id === activeDayId ? " active" : ""}" type="button" data-day-id="${escapeHtml(day.day_id)}">
              <span>第 ${index + 1} 關｜${escapeHtml(dayNames[day.weekday] || day.weekday)}</span>
              <strong>${escapeHtml(taskTypeLabels[day.task_type] || day.label)}</strong>
              <small>${escapeHtml((day.question_slots || []).length)} 題｜${escapeHtml(day.estimated_minutes || "--")} 分鐘</small>
            </button>
          `)
          .join("");
        const active = days.find((d) => d.day_id === activeDayId) || days[0];
        const cur = document.getElementById("questPickerCurrent");
        if (cur && active) {
          cur.textContent = `第 ${days.indexOf(active) + 1} 關｜${taskTypeLabels[active.task_type] || active.label}`;
        }
      }

      function clozeBlanks(escaped) {
        return escaped.replace(/\{\{(\d+)\}\}/g, '<span class="cloze-blank">($1)</span>');
      }

      function stripMarkers(escaped) {
        return escaped.replace(/\{\{(\d+)\}\}/g, "$1");
      }

      function renderMaterial(material) {
        return `
          <article class="english-material">
            <h3>${stripMarkers(escapeHtml(material.title || "Material"))}</h3>
            <p>${clozeBlanks(escapeHtml(material.content || ""))}</p>
            ${material.translation_zh ? `
              <details class="english-translation">
                <summary>中文翻譯</summary>
                <p>${escapeHtml(material.translation_zh)}</p>
              </details>
            ` : ""}
          </article>
        `;
      }

      function renderOption(option) {
        if (typeof option === "string") return { key: option.slice(0, 1), text: option };
        return { key: option.key, text: option.text };
      }

      function renderQuestion(question, index) {
        const name = `question_${index}`;
        const isMultiple = Array.isArray(question.answer) && question.answer.length > 1;
        const options = question.options?.length
          ? `<div class="english-option-list">${question.options.map(renderOption).map((option) => `
              <label class="english-option">
                <input type="${isMultiple ? "checkbox" : "radio"}" name="${escapeHtml(name)}" value="${escapeHtml(option.key)}" />
                <span><strong>${escapeHtml(option.key)}.</strong> ${escapeHtml(option.text)}</span>
              </label>
            `).join("")}</div>`
          : `<textarea class="english-written" name="${escapeHtml(name)}" placeholder="請用英文作答，完成後對照評分規準。"></textarea>`;
        return `
          <article class="english-question-card" data-question-index="${index}">
            <div class="english-question-header">
              <div class="social-tags">
                <span class="tag">挑戰 ${index + 1}</span>
                <span class="tag">${escapeHtml(question.question_type)}</span>
                <span class="tag">${escapeHtml(question.difficulty)}</span>
                <span class="tag">${escapeHtml(question.estimated_minutes || "--")} 分鐘</span>
                ${(question.unit_tags || []).slice(0, 2).map((tag) => `<span class="tag">${escapeHtml(tag)}</span>`).join("")}
              </div>
              <span class="english-status">${question.requires_written_response ? "寫作關" : "選擇挑戰"}</span>
            </div>
            <p>${escapeHtml(question.stem)}</p>
            ${options}
            <div class="english-answer-panel">
              <p><strong>參考答案：</strong>${escapeHtml(answerText(question.answer))}</p>
              ${question.scoring_rule ? `<p><strong>評分規準：</strong>${escapeHtml(question.scoring_rule)}</p>` : ""}
              <p><strong>解析：</strong>${escapeHtml(question.explanation)}</p>
              <p><strong>複習建議：</strong>${escapeHtml(question.review_advice)}</p>
            </div>
          </article>
        `;
      }

      // 依題幹線索把每題歸到它對應的文章，形成「文章＋答題卡」分段（不改題庫）
      function classifyQuestion(question) {
        const stem = String(question.stem || "");
        if (question.question_type === "reading_comprehension") {
          const match = stem.match(/【閱讀([一二三四五六七八九十]+)】/);
          const cnMap = { 一: 0, 二: 1, 三: 2, 四: 3, 五: 4, 六: 5 };
          const articleIndex = match && cnMap[match[1]] != null ? cnMap[match[1]] : 0;
          return { kind: "reading", articleIndex };
        }
        const gapMatch = stem.match(/第\s*(\d+)\s*格/);
        if (gapMatch) return { kind: "gap", num: parseInt(gapMatch[1], 10) };
        return { kind: "standalone" };
      }

      function buildSections(day) {
        const materials = day.day_materials || [];
        const gapMaterials = materials.filter((m) => ["cloze", "gapfill", "discourse"].includes(m.type));
        const readingMaterials = materials.filter((m) => m.type === "reading");
        const sections = [];
        const used = new Set();
        let standaloneSec = null;
        let gapSec = null;
        let gapMatPointer = -1;
        let prevGapNum = null;
        const readingSecByIdx = {};

        (day.question_slots || []).forEach((question, index) => {
          const info = classifyQuestion(question);
          if (info.kind === "standalone") {
            gapSec = null; prevGapNum = null;
            if (!standaloneSec) { standaloneSec = { material: null, questions: [] }; sections.push(standaloneSec); }
            standaloneSec.questions.push({ question, index });
          } else if (info.kind === "gap") {
            standaloneSec = null;
            if (prevGapNum === null || info.num !== prevGapNum + 1 || !gapSec) {
              gapMatPointer += 1;
              const material = gapMaterials[gapMatPointer] || null;
              if (material) used.add(material);
              gapSec = { material, questions: [] };
              sections.push(gapSec);
            }
            gapSec.questions.push({ question, index });
            prevGapNum = info.num;
          } else {
            standaloneSec = null; gapSec = null; prevGapNum = null;
            const ai = info.articleIndex;
            if (!readingSecByIdx[ai]) {
              const material = readingMaterials[ai] || null;
              if (material) used.add(material);
              readingSecByIdx[ai] = { material, questions: [] };
              sections.push(readingSecByIdx[ai]);
            }
            readingSecByIdx[ai].questions.push({ question, index });
          }
        });

        // 防呆：任何沒被引用到的文章仍完整呈現（放最前，避免遺漏材料）
        const orphan = materials.filter((m) => !used.has(m));
        orphan.forEach((m) => sections.unshift({ material: m, questions: [] }));
        return sections;
      }

      function renderSection(section) {
        const hasMat = Boolean(section.material);
        const matHtml = hasMat ? `<section class="split-material">${renderMaterial(section.material)}</section>` : "";
        const qHtml = section.questions.map(({ question, index }) => renderQuestion(question, index)).join("");
        const cls = hasMat ? "english-section split-layout" : "english-section";
        return `<section class="${cls}">${matHtml}<div class="english-section-questions">${qHtml}</div></section>`;
      }

      function renderActiveDay() {
        const day = days.find((item) => item.day_id === activeDayId) || days[0];
        if (!day) return;
        activeDayId = day.day_id;
        document.body.classList.remove("answered");
        document.getElementById("scorePanel").classList.remove("show");
        document.getElementById("scorePanel").innerHTML = "";
        renderTabs();
        document.getElementById("dayIntro").innerHTML = `
          <h3>${escapeHtml(day.label)}</h3>
          <p>${escapeHtml(focusText(day.planned_focus))}</p>
        `;
        document.getElementById("daySections").innerHTML = buildSections(day).map(renderSection).join("");
      }

      function getSelectedValues(form, index) {
        return Array.from(form.querySelectorAll(`[name="question_${index}"]:checked`)).map((input) => input.value).sort();
      }

      function scoreChoice(question, selected) {
        const answer = [...(Array.isArray(question.answer) ? question.answer : [question.answer])].map(String).sort();
        return selected.length === answer.length && selected.every((value, index) => value === answer[index]);
      }

      function getStarText(correct, total) {
        if (!total) return "☆☆☆";
        const rate = correct / total;
        const stars = rate >= 0.9 ? 3 : rate >= 0.7 ? 2 : 1;
        return "★".repeat(stars) + "☆".repeat(3 - stars);
      }

      function submitAnswers(event) {
        event.preventDefault();
        const form = event.currentTarget;
        const day = days.find((item) => item.day_id === activeDayId);
        const questions = day?.question_slots || [];
        let autoScored = 0;
        let correct = 0;
        let written = 0;

        questions.forEach((question, index) => {
          const card = document.querySelector(`[data-question-index="${index}"]`);
          card?.classList.remove("correct", "incorrect");
          if (question.requires_written_response || !question.options?.length) {
            written += 1;
            return;
          }
          autoScored += 1;
          const ok = scoreChoice(question, getSelectedValues(form, index));
          if (ok) correct += 1;
          card?.classList.add(ok ? "correct" : "incorrect");
        });

        document.body.classList.add("answered");
        const scorePanel = document.getElementById("scorePanel");
        scorePanel.classList.add("show");
        const stars = getStarText(correct, autoScored);
        const writtenNote = written ? `寫作關 ${written} 題請對照參考答案與評分規準，不自動判分。` : "本關沒有寫作題。";
        scorePanel.innerHTML = `
          <h2>本關通關結算</h2>
          <div class="quest-result-line">${stars}<span>英文主線進度：${escapeHtml(dayNames[day?.weekday] || "")}完成</span></div>
          <p>選擇挑戰自動判分：${correct} / ${autoScored} 題。${writtenNote}</p>
          <p class="muted-text">答錯題目已標示，先看解析與複習建議再重挑本關。</p>
        `;
        scorePanel.scrollIntoView({ behavior: "smooth", block: "start" });
      }

      function wireEvents() {
        document.getElementById("dayTabs").addEventListener("click", (event) => {
          const button = event.target.closest("[data-day-id]");
          if (!button) return;
          activeDayId = button.dataset.dayId;
          const picker = document.getElementById("questPicker");
          if (picker) picker.open = false;
          renderActiveDay();
          window.scrollTo({ top: 0, behavior: "smooth" });
        });
        document.getElementById("englishPracticeForm").addEventListener("submit", submitAnswers);
        document.getElementById("resetButton").addEventListener("click", () => renderActiveDay());
      }

      async function init() {
        const data = await loadData();
        days = (data.weeks || []).flatMap((week) => week.days || []);
        activeDayId = days[0]?.day_id || "";
        renderStats();
        renderActiveDay();
        wireEvents();
      }

      init().catch((error) => {
        document.querySelector(".english-practice-shell").innerHTML = `
          <section class="error-box">
            <h1>英文科題庫讀取失敗</h1>
            <p>${escapeHtml(error.message)}</p>
            <p>請改用阿里雲線上網址，或重新整理後再試。</p>
          </section>
        `;
      });
    </script>
  </body>
</html>
