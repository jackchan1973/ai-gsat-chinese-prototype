<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI學測考總複習｜國文闖關</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="../assets/css/style.css?v=20260815-ui03" />
    <link rel="stylesheet" href="../assets/css/ui-refresh.css?v=20260815-ui03" />
  </head>
  <body class="practice-page">
    <main class="app-shell practice-shell">
      <header class="topbar practice-topbar practice-quest-hero">
        <div>
          <p class="eyebrow">國文主線</p>
          <h1>今日任務地圖</h1>
          <p class="muted-text">完成暖身、閱讀挑戰與復活關，收集今日星等。</p>
        </div>
        <a class="home-return-action" href="../index.html">返回闖關地圖</a>
      </header>

      <section class="practice-stage" aria-label="今日闖關狀態">
        <div class="practice-stage-copy">
          <p class="eyebrow">Quest briefing</p>
          <h2 id="practiceTitle">讀取中</h2>
          <p id="practiceDescription">請稍候，正在讀取今日關卡。</p>
        </div>
        <div class="practice-stage-panel">
          <span id="practiceMeta">--</span>
          <div class="stage-route" aria-hidden="true">
            <strong>1</strong>
            <i></i>
            <strong>2</strong>
            <i></i>
            <strong>3</strong>
          </div>
          <p>先拿基礎分，再進入閱讀挑戰。</p>
        </div>
      </section>

      <details class="quest-picker" id="questPicker">
        <summary class="quest-picker-summary">
          <span class="qp-eyebrow">目前闖關日</span>
          <strong class="qp-current" id="questPickerCurrent">選擇闖關日</strong>
          <span class="qp-toggle">切換闖關日 <span class="qp-caret">▾</span></span>
        </summary>
        <div class="bank-day-tabs" id="taskTabs"></div>
      </details>

      <form id="practiceForm" class="practice-form-stack">
        <section class="panel basic-drill-panel quest-level-panel">
          <div class="section-title quest-level-title">
            <div>
              <span class="level-chip">Level 1</span>
              <h2>基礎暖身</h2>
            </div>
            <span id="basicBadge">0 題</span>
          </div>
          <div class="question-stack compact-question-stack" id="basicQuestionStack"></div>
        </section>

        <section class="practice-layout">
          <article class="panel passage-panel quest-level-panel">
            <div class="section-title quest-level-title">
              <div>
                <span class="level-chip">Material</span>
                <h2>關卡材料</h2>
              </div>
              <span id="groupBadge">--</span>
            </div>
            <div class="passage-box tall" id="passageBox"></div>
          </article>

          <article class="panel questions-panel quest-level-panel">
            <div class="section-title quest-level-title">
              <div>
                <span class="level-chip">Level 2</span>
                <h2>閱讀挑戰</h2>
              </div>
              <span id="questionBadge">0 題</span>
            </div>
            <div class="practice-tools" aria-label="作答進度">
              <div class="progress-row">
                <strong id="answeredCount">0 / 0 題</strong>
                <span id="unansweredCount">未作答 0 題</span>
              </div>
              <div class="progress-track"><span id="progressFill"></span></div>
              <div class="question-nav" id="questionNav" aria-label="題號快速跳轉"></div>
            </div>
            <div class="question-stack" id="readingQuestionStack"></div>
            <div class="sticky-submit">
              <button class="primary-action" type="submit">完成闖關看結算</button>
              <a class="secondary-link" href="../index.html">返回闖關地圖</a>
            </div>
          </article>
        </section>
      </form>
    </main>

    <script src="../assets/js/session.js?v=20260815-ui03"></script>
    <script src="../assets/js/practice.js?v=20260815-ui03"></script>
  </body>
</html>
