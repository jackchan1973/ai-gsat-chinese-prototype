<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI學測考總複習｜國文作答</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="../assets/css/style.css?v=20260802-k01-cards" />
  </head>
  <body class="practice-page">
    <main class="app-shell practice-shell">
      <header class="topbar practice-topbar">
        <div>
          <p class="eyebrow">國文今日任務</p>
          <h1>閱讀挑戰</h1>
        </div>
        <a class="home-return-action" href="../index.html">返回主頁</a>
      </header>

      <section class="panel wide-panel">
        <div class="section-title">
          <h2 id="practiceTitle">讀取中</h2>
          <span id="practiceMeta">--</span>
        </div>
        <p class="muted-text" id="practiceDescription">請稍候，正在讀取今日任務。</p>
      </section>

      <form id="practiceForm" class="practice-form-stack">
        <section class="panel basic-drill-panel">
          <div class="section-title">
            <h2>字音字形短練</h2>
            <span id="basicBadge">0 題</span>
          </div>
          <div class="question-stack compact-question-stack" id="basicQuestionStack"></div>
        </section>

        <section class="practice-layout">
          <article class="panel passage-panel">
            <div class="section-title">
              <h2>閱讀材料</h2>
              <span id="groupBadge">--</span>
            </div>
            <div class="passage-box tall" id="passageBox"></div>
          </article>

          <article class="panel questions-panel">
            <div class="section-title">
              <h2>題目</h2>
              <span id="questionBadge">0 題</span>
            </div>
            <div class="practice-tools" aria-label="作答進度">
              <div class="progress-row">
                <strong id="answeredCount">0 / 0 題</strong>
                <span id="unansweredCount">未作答 0 題</span>
              </div>
              <div class="progress-track"><span id="progressFill"></span></div>
              <div class="question-nav" id="questionNav" aria-label="題號快速跳轉"></div>
            </div>
            <div class="question-stack" id="readingQuestionStack"></div>
            <div class="sticky-submit">
              <button class="primary-action" type="submit">交卷看解析</button>
              <a class="secondary-link" href="../index.html">返回主頁</a>
            </div>
          </article>
        </section>
      </form>
    </main>

    <script src="../assets/js/session.js?v=20260804-class-1105"></script>
    <script src="../assets/js/practice.js?v=20260804-class-1105"></script>
  </body>
</html>
