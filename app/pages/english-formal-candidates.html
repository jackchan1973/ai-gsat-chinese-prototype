<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI學測考總複習｜英文正式題庫 v0.1</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="../assets/css/style.css?v=20260810-system01" />
    <style>
      .candidate-page {
        background:
          radial-gradient(circle at 12% 0%, rgba(124, 92, 255, 0.2), transparent 22rem),
          linear-gradient(180deg, #07131f 0, #102235 260px, #f3f7fb 260px, #f3f7fb 100%);
      }

      .candidate-shell {
        max-width: 1180px;
      }

      .candidate-page .topbar {
        align-items: center;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 8px;
        padding: 20px;
        background: linear-gradient(135deg, rgba(7, 19, 31, 0.96), rgba(76, 58, 167, 0.82));
        color: #fff;
      }

      .candidate-page .topbar h1,
      .candidate-page .topbar .eyebrow {
        color: #fff;
      }

      .candidate-alert,
      .candidate-stats,
      .candidate-day,
      .candidate-question {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        box-shadow: var(--shadow);
      }

      .candidate-alert {
        margin: 16px 0;
        padding: 16px;
        background: linear-gradient(135deg, #ffffff, #f3f0ff);
      }

      .candidate-alert p {
        margin-bottom: 0;
        color: var(--muted);
      }

      .candidate-stats {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 10px;
        margin-bottom: 16px;
        padding: 14px;
      }

      .candidate-stat {
        border: 1px solid rgba(124, 92, 255, 0.16);
        border-radius: 8px;
        padding: 12px;
        background: #f8f7ff;
      }

      .candidate-stat span {
        display: block;
        color: var(--muted);
        font-size: 0.86rem;
      }

      .candidate-stat strong {
        display: block;
        margin-top: 4px;
        color: #4b3aa7;
        font-size: 1.45rem;
      }

      .candidate-toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 16px;
      }

      .candidate-filter {
        min-height: 44px;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 0 12px;
        background: #fff;
        color: var(--ink);
        font: inherit;
        font-weight: 800;
      }

      .candidate-list {
        display: grid;
        gap: 16px;
      }

      .candidate-day {
        padding: 16px;
      }

      .candidate-day-header,
      .candidate-question-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 12px;
      }

      .candidate-day h2 {
        margin: 0;
        color: #102235;
      }

      .candidate-status {
        display: inline-flex;
        align-items: center;
        min-height: 30px;
        border: 1px solid rgba(124, 92, 255, 0.22);
        border-radius: 999px;
        padding: 4px 10px;
        background: #f3f0ff;
        color: #4b3aa7;
        font-weight: 950;
        white-space: nowrap;
      }

      .candidate-material {
        margin: 12px 0;
        border: 1px solid rgba(3, 96, 121, 0.12);
        border-radius: 8px;
        padding: 14px;
        background: #f7fbfd;
      }

      .candidate-material p {
        margin-bottom: 0;
        white-space: pre-wrap;
      }

      .candidate-translation {
        margin-top: 12px;
        border: 1px solid rgba(3, 96, 121, 0.14);
        border-radius: 8px;
        background: #ffffff;
        color: var(--muted);
      }

      .candidate-translation summary {
        cursor: pointer;
        padding: 10px 12px;
        color: var(--primary);
        font-weight: 900;
      }

      .candidate-translation p {
        padding: 0 12px 12px;
      }

      .candidate-question {
        padding: 16px;
        overflow-wrap: anywhere;
        word-break: normal;
      }

      .candidate-options {
        display: grid;
        gap: 8px;
        margin: 12px 0;
        padding: 0;
        list-style: none;
      }

      .candidate-options li {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px 12px;
        background: #fbfcfd;
        overflow-wrap: anywhere;
      }

      .candidate-options strong {
        margin-right: 8px;
        color: #4b3aa7;
      }

      .candidate-answer,
      .candidate-review {
        margin-top: 12px;
        border: 1px solid rgba(3, 96, 121, 0.12);
        border-radius: 8px;
        padding: 12px;
        background: #f7fbfd;
      }

      @media (max-width: 760px) {
        .candidate-stats {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .candidate-day-header,
        .candidate-question-header,
        .candidate-page .topbar {
          align-items: flex-start;
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body class="candidate-page">
    <main class="app-shell candidate-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">AI學測考總複習</p>
          <h1>英文正式題庫 v0.1 batch_01</h1>
        </div>
        <a class="secondary-action link-action" href="../index.html">返回主頁</a>
      </header>

      <section class="candidate-alert" aria-label="題庫狀態">
        <strong>英文第一批已由 agent 審題通過</strong>
        <p>本批依 113、114、115 英文考科結構製作 AI 新題，文章長度、題目深度與解析完整度已檢查，狀態為 approved_for_app。</p>
      </section>

      <section class="candidate-stats" id="summaryStats" aria-label="統計"></section>

      <section class="candidate-toolbar" aria-label="篩選">
        <select class="candidate-filter" id="weekdayFilter" aria-label="星期篩選">
          <option value="all">全部星期</option>
          <option value="Mon">週一</option>
          <option value="Thu">週四</option>
          <option value="Sun">週日</option>
        </select>
        <select class="candidate-filter" id="typeFilter" aria-label="題型篩選">
          <option value="all">全部題型</option>
        </select>
      </section>

      <section class="candidate-list" id="candidateList" aria-live="polite"></section>
    </main>

    <script>
      const LOCAL_DATA_URL = "../../data/english_formal_candidates_v0_1_batch_01.json?v=20260810-system01";
      const REMOTE_DATA_URL = "https://jackchan1973.github.io/ai-gsat-chinese-prototype/data/english_formal_candidates_v0_1_batch_01.json?v=20260810-system01";
      const weekdayLabels = {
        Mon: "週一",
        Thu: "週四",
        Sun: "週日"
      };
      const statusLabels = {
        needs_human_review: "待人工審題",
        approved_for_app: "正式題"
      };
      let days = [];
      let questions = [];

      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;");
      }

      function answerText(answer) {
        return Array.isArray(answer) ? answer.join("、") : String(answer || "");
      }

      function getDataUrls() {
        return window.location.protocol === "file:" ? [REMOTE_DATA_URL, LOCAL_DATA_URL] : [LOCAL_DATA_URL, REMOTE_DATA_URL];
      }

      async function loadCandidateData() {
        const errors = [];
        for (const url of getDataUrls()) {
          try {
            const response = await fetch(url);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            return await response.json();
          } catch (error) {
            errors.push(`${url}: ${error.message}`);
          }
        }
        throw new Error(errors.join("；"));
      }

      function renderStats() {
        const written = questions.filter((item) => item.question.requires_written_response).length;
        const selection = questions.length - written;
        const stats = [
          ["總題數", questions.length],
          ["選擇題", selection],
          ["文字作答", written],
          ["任務日", days.length],
          ["狀態", "審題"]
        ];
        document.getElementById("summaryStats").innerHTML = stats
          .map(([label, value]) => `<div class="candidate-stat"><span>${escapeHtml(label)}</span><strong>${escapeHtml(value)}</strong></div>`)
          .join("");
      }

      function renderTypeFilter() {
        const types = Array.from(new Set(questions.map((item) => item.question.question_type))).sort();
        document.getElementById("typeFilter").innerHTML = '<option value="all">全部題型</option>' + types
          .map((type) => `<option value="${escapeHtml(type)}">${escapeHtml(type)}</option>`)
          .join("");
      }

      function renderMaterial(material) {
        return `
          <section class="candidate-material">
            <strong>${escapeHtml(material.title || "材料")}</strong>
            <p>${escapeHtml(material.content || "")}</p>
            ${material.translation_zh ? `
              <details class="candidate-translation">
                <summary>中文翻譯</summary>
                <p>${escapeHtml(material.translation_zh)}</p>
              </details>
            ` : ""}
          </section>
        `;
      }

      function renderQuestion(item, index) {
        const question = item.question;
        const statusText = statusLabels[question.status] || question.status || "未標";
        const options = question.options && question.options.length
          ? `<ul class="candidate-options">${question.options.map((option) => `<li><strong>${escapeHtml(option.key)}</strong>${escapeHtml(option.text)}</li>`).join("")}</ul>`
          : '<p class="candidate-empty">文字作答題，無選項。</p>';
        return `
          <article class="candidate-question" data-weekday="${item.weekday}" data-type="${escapeHtml(question.question_type)}">
            <div class="candidate-question-header">
              <div class="social-tags">
                <span class="tag">${escapeHtml(question.id)}</span>
                <span class="tag">${escapeHtml(question.question_type)}</span>
                <span class="tag">${escapeHtml(question.difficulty)}</span>
                <span class="tag">${question.requires_written_response ? "週日文字作答" : "選擇題"}</span>
              </div>
              <span class="candidate-status">${escapeHtml(statusText)}</span>
            </div>
            <p class="label">${escapeHtml(weekdayLabels[item.weekday] || item.weekday)} 第 ${index + 1} 題</p>
            <div>${escapeHtml(question.stem)}</div>
            ${options}
            <details class="candidate-answer">
              <summary>查看答案與解析</summary>
              <p><strong>答案：</strong>${escapeHtml(answerText(question.answer))}</p>
              ${question.scoring_rule ? `<p><strong>評分規準：</strong>${escapeHtml(question.scoring_rule)}</p>` : ""}
              <p><strong>解析：</strong>${escapeHtml(question.explanation)}</p>
              <p><strong>複習建議：</strong>${escapeHtml(question.review_advice)}</p>
            </details>
            <div class="candidate-review">
              <p><strong>審題紀錄：</strong>${escapeHtml((question.review_notes || []).join(" "))}</p>
              <p><strong>相似風險：</strong>${escapeHtml(question.similarity_risk || "未標")}</p>
            </div>
          </article>
        `;
      }

      function renderDay(day) {
        const dayQuestions = day.question_slots || [];
        const statusText = statusLabels[day.status] || day.status || "未標";
        return `
          <section class="candidate-day" data-weekday="${day.weekday}">
            <div class="candidate-day-header">
              <div>
                <p class="eyebrow">${escapeHtml(day.day_id)}</p>
                <h2>${escapeHtml(day.label)}</h2>
              </div>
              <span class="candidate-status">${escapeHtml(statusText)}</span>
            </div>
            ${(day.day_materials || []).map(renderMaterial).join("")}
            <div class="candidate-list">
              ${dayQuestions.map((question, index) => renderQuestion({ weekday: day.weekday, question }, index)).join("")}
            </div>
          </section>
        `;
      }

      function renderList() {
        const weekday = document.getElementById("weekdayFilter").value;
        const type = document.getElementById("typeFilter").value;
        const filteredDays = days
          .filter((day) => weekday === "all" || day.weekday === weekday)
          .map((day) => ({
            ...day,
            question_slots: day.question_slots.filter((question) => type === "all" || question.question_type === type)
          }))
          .filter((day) => day.question_slots.length);
        document.getElementById("candidateList").innerHTML = filteredDays.length
          ? filteredDays.map(renderDay).join("")
          : '<div class="candidate-empty">沒有符合條件的題目。</div>';
      }

      async function init() {
        const data = await loadCandidateData();
        days = (data.weeks || []).flatMap((week) => week.days || []);
        questions = days.flatMap((day) => (day.question_slots || []).map((question) => ({ weekday: day.weekday, question })));
        renderStats();
        renderTypeFilter();
        renderList();
        document.getElementById("weekdayFilter").addEventListener("change", renderList);
        document.getElementById("typeFilter").addEventListener("change", renderList);
      }

      init().catch((error) => {
        document.querySelector(".candidate-shell").innerHTML = `
          <section class="error-box">
            <h1>英文題庫讀取失敗</h1>
            <p>${escapeHtml(error.message)}</p>
          </section>
        `;
      });
    </script>
  </body>
</html>
